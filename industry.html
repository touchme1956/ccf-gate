<!DOCTYPE html>
<html lang="ja"><head><script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ccf_theme")||"light");}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業種の伸び</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#0f1114;--ink2:#2b3038;--mute:#50565f;--up:#08873a;--down:#c62a1a;--info:#1e5fd1;--warn:#9a5b00;--hl:#f0f3f7}
html[data-theme="dark"],html[data-theme="soft"]{--bg:#121417;--card:#1a1d21;--line:#2a2e34;--ink:#f4f5f6;--ink2:#c9ccd1;--mute:#9aa0a8;--up:#29d35a;--down:#ff6a4d;--info:#6ea8ff;--warn:#f0a93a;--hl:#22262b}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.7 "Inter","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
a{color:var(--info)}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.card h2{font-size:15px;margin:0 0 8px}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 220px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:13px;color:var(--mute);font-weight:500}
.kpi span{font-size:18px;font-weight:600}
.note{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--card);color:var(--mute);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th.on{color:var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--hl)}
.p{color:var(--up)}.n{color:var(--down)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--info);vertical-align:middle;margin-left:6px}
tr.x td{background:var(--hl);white-space:normal;text-align:left}
.mini{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.mini svg{max-width:100%}
.mem{font-size:12.5px;line-height:1.7}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.warn{border-left:3px solid var(--warn)}
</style></head><body><div class="wrap">
<div class="sub"><a href="index.html">← 門へ戻る</a></div>
<h1>業種の伸び</h1>
<div class="sub" id="meta">読み込み中…</div>

<div class="card warn" id="check"></div>
<div class="card" id="peak"><h2>比重が「過去最大」になった業種は、その後どうなったか</h2><div class="note">読み込み中…</div></div>

<div class="card">
  <h2>業種の一覧 <span class="tag">見出しを押すと並べ替え・行を押すと推移と主な会社</span></h2>
  <div class="tw"><table id="t"></table></div>
  <p class="note" id="how"></p>
</div>
<div class="card" id="long"><h2>100年で見る（1926〜・Ken French 49業種）</h2><div class="note">読み込み中…</div></div>
<div class="card"><h2>限界</h2><ul class="note" id="lim" style="padding-left:18px;margin:0"></ul></div>
</div>
<script>
const P=v=>v==null?'—':(v*100).toFixed(1)+'%', PP=v=>v==null?'—':(v>0?'+':'')+(v*100).toFixed(1);
const cls=v=>v==null?'':(v>0?'p':(v<0?'n':''));
const COLS=[
 ['ja','業種',r=>r.ja+(r['社数が少ない']?'<span class="tag">社数少</span>':'')+(r['金融']?'<span class="tag">金融</span>':''),null],
 ['勢い','勢い',r=>r['勢い']==null?'—':r['勢い'].toFixed(2)+'<span class="bar" style="width:'+Math.round((r['勢い']||0)*40)+'px"></span>',0],
 ['成長3年','売上 3年',r=>`<span class="${cls(r['成長3年'])}">${P(r['成長3年'])}</span>`,1],
 ['加速','加速',r=>`<span class="${cls(r['加速'])}">${PP(r['加速'])}</span>`,1],
 ['成長1年','売上 1年',r=>`<span class="${cls(r['成長1年'])}">${P(r['成長1年'])}</span>`,1],
 ['成長10年','売上 10年',r=>P(r['成長10年']),1],
 ['営業利益率','営業利益率',r=>P(r['営業利益率']),1],
 ['利益率の3年変化','利益率 3年差',r=>`<span class="${cls(r['利益率の3年変化'])}">${PP(r['利益率の3年変化'])}</span>`,1],
 ['ROE','ROE',r=>P(r['ROE']),1],
 ['設備投資率の3年変化','設備投資率 3年差',r=>`<span class="${cls(r['設備投資率の3年変化'])}">${PP(r['設備投資率の3年変化'])}</span>`,1],
 ['研究開発率','研究開発率',r=>P(r['研究開発率']),1],
 ['広がり','伸びた社の割合',r=>P(r['広がり']),1],
 ['超過リターン3年','株価 3年 対市場',r=>`<span class="${cls(r['超過リターン3年'])}">${PP(r['超過リターン3年'])}</span>`,1],
 ['超過リターン10年','株価 10年 対市場',r=>`<span class="${cls(r['超過リターン10年'])}">${PP(r['超過リターン10年'])}</span>`,1],
 ['社数','社数',r=>r['社数'],1]];
let D,sortK='勢い',asc=false,open=null;
function spark(obj,w,h,lab){const ks=Object.keys(obj).sort(),v=ks.map(k=>obj[k]);if(!v.length)return'';
 const lo=Math.min(0,...v),hi=Math.max(0,...v),sx=i=>6+i*(w-12)/Math.max(1,v.length-1),sy=x=>h-14-(x-lo)/(hi-lo||1)*(h-24);
 const pts=v.map((x,i)=>sx(i).toFixed(1)+','+sy(x).toFixed(1)).join(' ');
 return `<svg width="${w}" height="${h}" role="img" aria-label="${lab}"><line x1="6" x2="${w-6}" y1="${sy(0)}" y2="${sy(0)}" stroke="currentColor" opacity=".25"/>
 <polyline fill="none" stroke="var(--info)" stroke-width="2" points="${pts}"/>
 ${v.map((x,i)=>`<circle cx="${sx(i)}" cy="${sy(x)}" r="2.5" fill="${x<0?'var(--down)':'var(--info)'}"><title>${ks[i]}: ${P(x)}</title></circle>`).join('')}
 <text x="6" y="${h-2}" font-size="10" fill="currentColor" opacity=".6">${ks[0]}</text><text x="${w-6}" y="${h-2}" font-size="10" text-anchor="end" fill="currentColor" opacity=".6">${ks[ks.length-1]}</text></svg>`;}
function render(){
 const rows=D.rows.slice().sort((a,b)=>{const x=a[sortK],y=b[sortK];if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y):x-y)*(asc?1:-1);});
 let h='<thead><tr>'+COLS.map(c=>`<th data-k="${c[0]}" class="${c[0]===sortK?'on':''}">${c[1]}${c[0]===sortK?(asc?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
 for(const r of rows){h+=`<tr class="r" data-k="${r.k}">`+COLS.map(c=>`<td>${c[2](r)}</td>`).join('')+'</tr>';
  if(open===r.k){h+=`<tr class="x"><td colspan="${COLS.length}"><div class="mini">
   <div><div class="note">売上成長（同じ社・年ごと）</div>${spark(r['年ごとの売上成長'],300,110,'売上成長の推移')}</div>
   <div><div class="note">営業利益率（年ごと）</div>${spark(r['年ごとの営業利益率'],300,110,'営業利益率の推移')}</div>
   <div class="mem"><div class="note">売上の大きい社（${D['最新の年']}年・十億$・前年比）</div>${r['大きい社'].map(m=>`${m.name}　${m.rev}　<span class="${cls(m.g)}">${P(m.g)}</span>`).join('<br>')}</div>
   </div></td></tr>`;}}
 document.getElementById('t').innerHTML=h+'</tbody>';
 document.querySelectorAll('#t th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)asc=!asc;else{sortK=k;asc=k==='ja';}render();});
 document.querySelectorAll('#t tr.r').forEach(tr=>tr.onclick=()=>{open=open===tr.dataset.k?null:tr.dataset.k;render();});
}
fetch('out/industry_trends.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;
 document.getElementById('meta').textContent=`${d['最新の年']}年までの決算（SEC）・株価は${String(d['リターンの最終月']).replace(/(\d{4})(\d\d)/,'$1-$2')}まで・${d['母集団']}・更新 ${d.generated}`;
 const a=d['答え合わせ'],q1=a['問い1_売上の伸びは続くか']||{},q2=a['問い2_株価は上がったか']||{},t5=a['勢いの上位5_次の3年の超過(年率%)']||{};
 document.getElementById('check').innerHTML=`<h2>この物差しは先を当てたか（${(a['起点ごと']||[]).length}起点の答え合わせ）</h2>
 <div class="kpis"><div class="kpi"><b>「勢い」上位は、次の3年も売上が伸びたか</b><span>${q1['判定']||'—'}</span><div class="note">順位相関 平均 ${q1['平均']??'—'} ・正の起点 ${q1['正の起点']||'—'}</div></div>
 <div class="kpi"><b>「勢い」上位の業種の株価は、次の3年に市場に勝ったか</b><span>${q2['判定']||'—'}</span><div class="note">順位相関 平均 ${q2['平均']??'—'} ・正の起点 ${q2['正の起点']||'—'}</div></div>
 <div class="kpi"><b>勢いの上位5業種を買っていたら（次の3年・対市場）</b><span>${t5['中央']==null?'—':(t5['中央']>0?'+':'')+t5['中央']+'%/年'}</span><div class="note">勝った起点 ${t5['勝った起点']||'—'}</div></div></div>
 <p class="note">売上の伸びが続くことと、株価が上がることは別の話です。伸びていることが知られている業種は、株価にすでに織り込まれていることが多いです。</p>`;
 document.getElementById('how').innerHTML=d['読み方'].join('<br>');
 document.getElementById('lim').innerHTML=d['⚠限界'].map(x=>`<li>${x}</li>`).join('');
 render();}).catch(e=>{document.getElementById('meta').textContent='out/industry_trends.json を読めませんでした: '+e;});

fetch('out/industry_long.json',{cache:'no-cache'}).then(r=>r.json()).then(L=>{
 const a=L['答え合わせ'],q1=a['問い1_簿価の伸びは続くか']||{},q5=a['問い2_次の5年の超過']||{},d5=a['上位10−下位10_次の5年(%/年)']||{},d10=a['上位10−下位10_次の10年(%/年)']||{};
 const decs=Object.keys((L.rows[0]||{})['年代ごとの超過(%/年)']||{});
 const hc=v=>v==null?'':(v>0?`background:rgba(8,135,58,${Math.min(.45,Math.abs(v)/25)})`:`background:rgba(198,42,26,${Math.min(.45,Math.abs(v)/25)})`);
 let h=`<div class="note">${L['期間']}。簿価＝その業種の上場企業の自己資本の合計（資本が集まった速さ）。株価は時価加重・配当込み・市場との差。</div>
 <div class="kpis" style="margin-top:8px"><div class="kpi"><b>簿価が速く伸びた業種は、次の5年も伸びたか</b><span>${q1['平均']>0?'続く向き':'続かない'}</span><div class="note">順位相関 平均 ${q1['平均']} ・正の起点 ${q1['正の起点']} ・1990年以降 ${q1['1990年以降の平均']}</div></div>
 <div class="kpi"><b>簿価の伸び上位10業種 − 下位10業種（次の5年の株価）</b><span>${d5['平均']>0?'+':''}${d5['平均']}%/年</span><div class="note">正の起点 ${d5['正の起点']} ・1990年以降 ${d5['1990年以降の平均']}%/年</div></div>
 <div class="kpi"><b>同じく次の10年</b><span>${d10['平均']>0?'+':''}${d10['平均']}%/年</span><div class="note">正の起点 ${d10['正の起点']} ・1990年以降 ${d10['1990年以降の平均']}%/年</div></div></div>
 <p class="note">100年で見ると、資本が速く集まった業種はその後も集まり続けるが、株価はむしろ少し負けやすい（投資を膨らませた業種ほど、その後のリターンが低い）。</p>
 <div class="tw"><table><thead><tr><th>業種</th><th>時価の比重 今</th><th>最大（年）</th><th>簿価 30年</th><th>全期間 対市場</th>${decs.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;
 for(const r of L.rows){h+=`<tr><td>${r.ja}</td><td>${P(r['比重の今'])}</td><td>${P(r['比重の最大'])}（${r['比重が最大だった年']}）</td><td>${P(r['簿価の成長30年'])}</td><td class="${cls(r['全期間の超過(%/年)'])}">${r['全期間の超過(%/年)']==null?'—':(r['全期間の超過(%/年)']>0?'+':'')+r['全期間の超過(%/年)']}</td>${decs.map(d=>{const v=r['年代ごとの超過(%/年)'][d];return `<td style="${hc(v)}">${v==null?'—':(v>0?'+':'')+v}</td>`;}).join('')}</tr>`;}
 h+='</tbody></table></div><p class="note">年代の列＝その10年の株価の年率 − 市場（%/年）。緑は市場に勝った年代、赤は負けた年代。</p>';
 document.getElementById('long').innerHTML='<h2>100年で見る（1926〜・Ken French 49業種）</h2>'+h;
}).catch(e=>{document.getElementById('long').innerHTML='<h2>100年で見る</h2><div class="note">out/industry_long.json を読めませんでした</div>';});
Promise.all(['out/industry_peak.json','out/industry_exposure.json'].map(u=>fetch(u,{cache:'no-cache'}).then(r=>r.json()))).then(([K,X])=>{
 const pr=K['主_閾値5%・次の10年・山ごと']||{},bs=K['比較群_記録でない年(比重5%以上)・10年']||{},p20=(K['道筋_山ごと']||{})['20年']||{};
 const hs=(K['副']||{})['★後知恵: 山の最後の記録(最大の年)・10年']||{},ag=K['記録の後_5年以内にもう一度記録が来た割合(その時点の基礎率)']||{};
 const sg=v=>v==null?'—':(v>0?'+':'')+v;
 const now=(K['今_記録を付けている業種']||[]).map(r=>`${r.ja} ${P(r['比重'])}（${r['今の山の最初の記録']}年から記録${r['今の山の記録の年数']}回）`).join('・');
 let h=`<h2>比重が「過去最大」になった業種は、その後どうなったか <span class="tag">1936〜${K['比重の最新の年']}・事前登録つき</span></h2>
 <div class="note">いま記録を付けている業種: ${now||'—'}。比重（その業種の時価総額 ÷ 米国株全体）が、それまでのどの年よりも大きくなった年を「記録」と数え、その後10年・20年の株価を市場と比べた（比重5%以上の業種・同じ業種の続く記録は一つの山にまとめる）。</div>
 <div class="kpis" style="margin-top:8px">
 <div class="kpi"><b>判定（事前登録の決まりどおり）</b><span>${K['判定']}</span><div class="note">次の10年に市場に勝った山 ${pr['勝った山']}・中央値 ${sg(pr['中央値(%/年)'])}%/年</div></div>
 <div class="kpi"><b>比べる相手: 記録ではない大きな業種</b><span>${sg(bs['中央値(%/年)'])}%/年</span><div class="note">勝率 ${Math.round((bs['勝率']||0)*100)}%（比重5%以上の業種の年 ${bs['業種の年']}）</div></div>
 <div class="kpi"><b>次の20年</b><span>${sg(p20['中央値(%/年)'])}%/年</span><div class="note">勝った山 ${p20['勝った山']||'—'}</div></div>
 <div class="kpi"><b>記録の後、5年以内にもう一度記録</b><span>${Math.round((ag['割合']||0)*100)}%</span><div class="note">記録は続きやすい。どれが最後の記録かは、その時点では分からない</div></div></div>
 <p class="note">★「最大だった年」から数えると ${sg(hs['中央値(%/年)'])}%/年（勝った山 ${hs['勝った山']}）とずっと悪く見える。最大の年は後から見て初めて分かる年で、その後は定義上比重が下がるため。上の数字は、その時点で分かる記録ごとに数えた後知恵なしの版。</p>
 <div class="tw"><table><thead><tr><th>業種</th><th>記録の年</th><th>比重</th><th>次の10年 対市場</th><th>次の20年</th><th>10年後の比重</th></tr></thead><tbody>`;
 for(const r of (K['山']||[])){const a=r['次の10年の超過(山の中央値・%/年)'],b=r['次の20年の超過(山の中央値・%/年)'],m=r['10年後の比重÷記録の年(山の中央値)'];
  h+=`<tr><td>${r.ja}${r['今も続いている']?'<span class="tag">続いている</span>':''}</td><td>${r['最初の記録']===r['最後の記録']?r['最初の記録']:r['最初の記録']+'〜'+r['最後の記録']}（${r['記録の年数']}回）</td><td>${P(r['最初の比重'])}→${P(r['最大の比重'])}</td><td class="${cls(a)}">${a==null?'—':sg(a)}</td><td class="${cls(b)}">${b==null?'—':sg(b)}</td><td>${m==null?'—':m.toFixed(2)+'倍'}</td></tr>`;}
 h+=`</tbody></table></div><p class="note">対市場＝業種の年率 − 市場の年率（%/年・配当込み）。山の中の記録ごとの値の中央値。長い山（家庭用品1963〜・銀行1988〜・コンピュータ機器1961〜）では、最初のほうの記録の後は勝ち、終わりのほうの記録の後に大きく負けた。</p>`;
 const M=X['米国市場全体(French・2025年末)']||{},n=X['今の保有']||{},t=X['目標の姿']||{};
 const two=(b,c)=>(b[`記録の二業種(ソフトウェア＋半導体・電子部品)_${c}`]||{})['%'];
 h+=`<h2 style="margin-top:14px">自分のお金のうち、この二つの業種に乗っている割合</h2>
 <div class="kpis"><div class="kpi"><b>米国株全体</b><span>${M['二つの合計(%)']}%</span><div class="note">ソフトウェア ${M['ソフトウェア(%)']}%・半導体・電子部品 ${M['半導体・電子部品(%)']}%</div></div>
 <div class="kpi"><b>今の保有</b><span>${two(n,'French寄せ')}%</span><div class="note">ソフトウェア ${(n['記録の二業種(ソフトウェア＋半導体・電子部品)_French寄せ']||{})['ソフトウェア(%)']}%・半導体・電子部品 ${(n['記録の二業種(ソフトウェア＋半導体・電子部品)_French寄せ']||{})['半導体・電子部品(%)']}%・未分類 ${n['未分類(%)']}%</div></div>
 <div class="kpi"><b>目標の姿（個別20・iFreeNEXT 60・SMH 20）</b><span>${two(t,'French寄せ')}%</span><div class="note">ソフトウェア ${(t['記録の二業種(ソフトウェア＋半導体・電子部品)_French寄せ']||{})['ソフトウェア(%)']}%・半導体・電子部品 ${(t['記録の二業種(ソフトウェア＋半導体・電子部品)_French寄せ']||{})['半導体・電子部品(%)']}%</div></div></div>
 <p class="note">ETF は中身の銘柄まで分解し、SEC の業種コードで French と同じ49業種に分けた。Apple は French の分類に合わせて半導体・電子部品に数えた（SEC の業種コードのままならコンピュータ機器で、今 ${two(n,'EDGAR')}%・目標 ${two(t,'EDGAR')}%）。ASML・LRCX は French の分類では「機械」なので上の割合に入っていない。半導体の装置まで含めた半導体の連鎖は 今 ${n['半導体の連鎖(装置・材料を含む・lookthrough の SEMI)(%)']}%・目標 ${t['半導体の連鎖(装置・材料を含む・lookthrough の SEMI)(%)']}%。</p>`;
 document.getElementById('peak').innerHTML=h;
