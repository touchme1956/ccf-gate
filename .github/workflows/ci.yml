# ─────────────────────────────────────────────────────────────────────────────
# 門の検査（push / PR）
#
# なぜ要るか（2026-08-06新設）
#   この repo は優れた検査器を**すでに持っている**（check_html / validate_packs /
#   score_all / audit_gate / audit_docs）。ところが既存のワークフロー3本は
#   すべて schedule + workflow_dispatch で、**編集した瞬間に走るものが一つも無かった**。
#   CLAUDE.md の歴史は「編集で入った欠陥を数日〜数週間後に手作業の監査で発見した」記録の連続で、
#   実際に踏んだものだけでも:
#     ・日本株審査依頼文が廃止済みの旧JP規約を配り続けていた
#     ・審査プロトコル正本の p2 ルーブリックに p3 の刻みが混入していた
#     ・堀の線を 75→70 にしたのに依頼文テンプレ3箇所に 75 が残っていた
#     ・Ωの合成式の説明が3本柱のまま（コードは v9.9.36 以降 4本柱）
#   いずれも**採点は動かないので誰も気づかない**型。CIがあれば混入した日に落ちていた。
#
# 思想
#   このCIは**読むだけ**で、採点にも台帳にも一切書き込まない（絶対のルール1）。
#   落とすのは「壊れている」ことが機械で確定できるものだけ:
#     構造検査・説明とコードの齟齬・投下可の顔ぶれの差分。
#   根拠の被覆（validate_packs のFAIL）は既知の積み残しなので**表示のみ・落とさない**
#   ——鳴りすぎる警報は鳴らないのと同じ。
# ─────────────────────────────────────────────────────────────────────────────

name: gate-ci

on:
  # 2026-08-10: **schedule を足した。** ここが最大の穴だった——
  #   このCIが作る out/stale_bs.json ／ out/validate_fail.json ／ out/pack_stale.json は
  #   **第四の関門そのもの**が読む（night/score_all.js:177-178 と index.html:4354,4368）。
  #   回転盤(night/ops_status.py:122,129,141)は3本を「**毎営業日・期限4日**」と採点しているのに、
  #   実際には push/PR のときしか走らず、しかも**書き戻していなかった**（下の permissions を見よ）。
  #   一方 market.yml は毎営業日パックの per を書き換えて score_all を回す。
  #   ＝**買付の顔ぶれだけが毎日更新され、それを裁く健全性の表は人が触った日にしか更新されない**
  #   という、甘い側へ静かに壊れる形になっていた。
  #   ⚠ bot の push は GITHUB_TOKEN なので（GitHubの再帰防止で）このCIを起動しない。
  #     だから push トリガでは代わりにならず、schedule が要る。
  schedule:
    - cron: '0 22 * * 1-5'   # 平日 22:00 UTC＝market.yml(21:30)の後・events.yml(22:10)の前
  push:
    branches: ['**']
    paths:
      - 'index.html'
      - 'chomirai.html'
      - 'ami.html'
      - 'portfolio.html'
      - 'saiten.html'
      - 'v10.html'
      - 'portfolio.json'
      - 'todo_list.json'
      - 'kanshi_list.json'
      - 'gate_exceptions.json'
      - '*.py'
      - 'night/**'
      - 'out/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

# 2026-08-10: read → write。**検査の結果を残すため**（下の「検査結果のコミット」を見よ）。
#   このCIが**採点や台帳に書き込まない**という思想は不変——書くのは out/ の検査結果JSONだけで、
#   パックにも index.html にも触れない。
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # v9.9.140: **`| tail` が失敗を緑に化かすのを止める。**
    #   宣言が無いと pipefail が付かず、`検査 | tail -25` は tail の成功だけを見る
    #   ＝「検査を回したつもりで回っていない」が緑のまま通る。
    #   実測(2026-08-11)で、今日のCIは pipefail を入れても壊れない（該当コマンドは全て exit 0）。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 投下可の差分を出すのに base 側の index.html が要る

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # ── 1. 構造検査（タブのdiv収支・参照IDの実在・スクリプト構文）────────────
      - name: 構造検査 check_html
        run: python3 night/check_html.py

      # 別枠の門（chomirai/ami/v10/portfolio）も最低限の健全性を見る。
      #   本体だけ検査して別枠が壊れたまま配信される、を防ぐ。
      - name: 別枠ページの健全性（JSON構文・参照ファイルの実在）
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          bad = []
          for f in ['portfolio.json', 'holdings.json', 'kanshi_list.json',
                    'todo_list.json', 'out/etf_profiles.json']:
              if not os.path.exists(f):
                  bad.append(f'{f}: 無い'); continue
              try: json.load(open(f, encoding='utf-8'))
              except Exception as e: bad.append(f'{f}: {e}')
          # 別枠HTMLが fetch している同一オリジンのファイルが実在するか
          for page in ['ami.html', 'index.html']:
              if not os.path.exists(page): continue
              h = open(page, encoding='utf-8').read()
              for m in re.findall(r"fetch\('([^']+?)(?:\?[^']*)?'", h):
                  if m.startswith(('http', '//')): continue
                  if not os.path.exists(m): bad.append(f'{page} が読む {m} が無い')
          if bad:
              print('\n'.join('✗ ' + b for b in bad)); sys.exit(1)
          print('✓ 別枠ページの参照先はすべて実在')
          PY

      # ── 2. 説明文とコードの整合（この repo の再発する失敗の型）────────────────
      - name: 説明とコードの齟齬 audit_docs
        run: python3 night/audit_docs.py

      # ── 2-a. 人の決定の正本 state.json（v9.9.131）──────────────────────────
      #   ブラウザが吐いたファイルを人がコミットする経路なので、**形が壊れたまま入りうる**。
      #   壊れていると門は「未初期化」と読んで黙って何もしない＝壊れたことが誰にも見えない。
      #   とくに pf:portfolio の positions 配列が欠けると、門を開いた瞬間に
      #   Ⅶ資産が既定値へ落として**書き戻す**（repoの株数が消える）ので落とす。
      - name: 人の決定の検査 validate_state
        run: python3 night/validate_state.py

      # ── 2-b. 納品検査のFAIL表を作り直す（v9.9.95）────────────────────────────
      #   **score_all より先**でなければならない——第四の関門がこのJSONを読むので、
      #   古い表のまま採点すると「関門は通っているのに根拠が無い」社が投下可に出る。
      #   ネットワーク不要・全362件で0.4秒。
      - name: 納品検査FAIL表の再生成 validate_packs --json
        run: python3 night/validate_packs.py --json --summary | tail -4

      # ── 3. 門を実際に走らせる（compute() をDOMシムで実行＝再実装ではない）──────
      - name: 全パック採点 score_all
        run: node night/score_all.js

      # ── 4. 台帳の破損（要修正＝取込で化けた/列挙違反/内部矛盾/不可能値）────────
      #      第四の関門の土台。errが出たら落とす。
      - name: 全件点検 audit_gate
        run: |
          node night/audit_gate.js --all | tail -40
          node -e "
            const rows=require('./out/score_all.json');
            const e=rows.filter(r=>r.audE>0);
            if(e.length){console.error('要修正のあるパック: '+e.map(r=>r.t+'('+r.audE+')').join(' '));}
            // 既知の2件だけは許容する。**どちらも値が誤っているのではなく帯の外にいる**——
            //   AMBIQ 営業利益率 −54.5%（帯[−50,90]・赤字IPO社）
            //   CMTL  roicg −64.1（帯[−60,220]・営業損失に対しICが小さい。2026-08-07の全数審査で確定）
            // 帯は較正済みなのでこちらを触らず実額を残す、というCLAUDE.mdの判断をそのまま写している。
            // 両社ともΩ0で四関門の第一に落ちるため買付判断への実害はない。
            // 増えたら落とす＝「今より悪くしない」ラチェット。
            const KNOWN=['AMBIQ','CMTL'];
            const unknown=e.filter(r=>!KNOWN.includes(r.t));
            if(unknown.length){console.error('✗ 新しい要修正が入った'); process.exit(1);}
            console.log('✓ 要修正は既知の'+e.length+'件のみ');
          "

      # ── 4-b. 繰り上がる前に、繰り上がる社を検査する ───────────────────────────
      #   2026-08-06 に「10番目の席が動くたびに未監査のパックが露出する」を6回連続で踏んだ
      #   （ECL→ISRG→IDXX→APH→CDNS→MCO。うち2社は誤値そのものが出て投下可から脱落）。
      #   validate_packs の FAIL を**投下可だけ**で運用していたのが原因で、これは
      #   事務作業の遅れではなく**未監査の社が席に着いてから初めて検査される**という順序の問題。
      #   二層で守る（第四の関門と同じ作法）:
      #     ・投下可に FAIL → 落とす（今日はゼロ＝ラチェット）
      #     ・次点に FAIL   → 名指しで警告（今日は5社。hard fail にすると常時赤＝警報が死ぬ）
      - name: 繰り上がり前の検査 audit_promotion_ready
        run: python3 night/audit_promotion_ready.py --json

      # ── 5. 投下可の顔ぶれが変わったら**必ず目に見える形で**出す ────────────────
      #      黙って変わるのが一番怖い（v9.9.52「城の行が理由不明で出ない」の教訓）。
      - name: 投下可の差分
        run: |
          # base(通常main)側の score_all.json を取り出して**本当に差分を取る**。
          #   名前が「差分」なのに現在値を出すだけ、では v9.9.65 の
          #   「同じ台帳を見る二つの検査器が違うことを言ってはいけない」の同型になる。
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git show "$BASE:out/score_all.json" > /tmp/base_score.json 2>/dev/null || echo '[]' > /tmp/base_score.json
          node -e "
            const fs=require('fs');
            const cur=require('./out/score_all.json');
            let base=[]; try{base=JSON.parse(fs.readFileSync('/tmp/base_score.json','utf8'))}catch{}
            const B=Object.fromEntries(base.map(r=>[r.t,r]));
            const cb=cur.filter(r=>r.buy).map(r=>r.t), bb=base.filter(r=>r.buy).map(r=>r.t);
            console.log('🟢投下可 '+cb.length+'社: '+cb.join(' '));
            console.log('Ω75+ '+cur.filter(r=>(r.s||0)>=75).length+'社 / 全'+cur.length+'社');
            if(!base.length){ console.log('（base側の score_all.json が無いので差分は取れない）'); process.exit(0); }
            const out=bb.filter(t=>!cb.includes(t)), inn=cb.filter(t=>!bb.includes(t));
            if(out.length||inn.length){
              console.log('::warning::投下可が変わった —— 出: '+(out.join(' ')||'—')+' ／ 入: '+(inn.join(' ')||'—'));
            } else console.log('投下可の顔ぶれは不変');
            // Ωが1pt以上動いた社（黙って動くのが一番怖い・v9.9.52の教訓）
            const moved=cur.map(r=>[r.t,(B[r.t]||{}).s,r.s])
              .filter(x=>typeof x[1]==='number'&&Math.abs(x[2]-x[1])>=1)
              .sort((a,b)=>Math.abs(b[2]-b[1])-Math.abs(a[2]-a[1]));
            console.log('Ωが1pt以上動いた社: '+moved.length+'件');
            moved.slice(0,15).forEach(([t,b,c])=>console.log('   '+t+' '+b.toFixed(1)+' → '+c.toFixed(1)+' ('+(c-b>=0?'+':'')+(c-b).toFixed(1)+')'));
          "

      # ── 5-b. 期末後の重大事象で貸借対照表が古いパック ──────────────────────────
      #   SECへ問い合わせるので**判定圏(Ω72+)だけ**。ネットワークが不調でも落とさない
      #   （検査できないことを「異常なし」と偽らないため、失敗はログに残す）。
      #   out/stale_bs.json は score_all.js と門の Ⅵ が第四の関門として読む。
      #   ⚠2026-08-10: **--write が付いていなかった**——out/stale_bs.json は第四の関門が読むのに
      #     CIは生成すらしていなかった（night/audit_stale_bs.py:65 が `WRITE = "--write" in ARGV`）。
      #     しかも回転盤の案内文(night/ops_status.py:124)は --write 付きで書いてあった＝
      #     **盤が「CIが回している」と言っている作業をCIは回していなかった**。
      - name: 期末後の重大事象 audit_stale_bs（表示のみ・SEC問い合わせ）
        continue-on-error: true
        run: timeout 900 python3 night/audit_stale_bs.py --write | tail -25

      # ── 5-b2. 合意済み・**未完了**の重大事象（v9.9.128・2026-08-10）────────────
      #   stale_bs は「実際にBSに載ったのれん」を見るので、**未完了の買収はのれんゼロで
      #   構造的に見えない**——合意/判決からクローズを経て次の10-Qが出るまでが無防備だった。
      #   【発端】デラウェア州衡平法裁判所が VRSK に AccuLynx($2.35B)の完了を命じた日、
      #   VRSK は 🟢投下可 のままだった。判定は acq5・stale_bs と同じ問い・同じ刻み。
      #   out/pending.json は score_all.js と門の Ⅵ・盤 が第四の関門として読む。
      - name: 未完了の重大事象 audit_pending（表示のみ・SEC問い合わせ）
        continue-on-error: true
        run: timeout 900 python3 night/audit_pending.py --all --write | tail -20

      # ── 5-b3. irr=85 をユーザーの基準で採点（2026-08-11新設）─────────────────────
      #   【なぜ】ユーザーの選定ルール（irr=85 ∧ 営利率11.89 ∧ FCF転換5年0.639 ∧ 成長1.76・nde除く）は
      #   対話で決まったが**機械のどこにも書かれていなかった**。一方 irr=85 の顔ぶれは
      #   日次の門2審査 Routine が毎日パックを足すので動く（実測: 2026-08-11 のセッション中に14→15社）。
      #   **判定は一切変えない**（読むだけ・score_all も index.html も触らない）——出すのは
      #   out/irr85_myrule.json と、新着／門との食い違い／**未決の分岐(堀70)** の名指しだけ。
      - name: irr=85 をあなたの基準で採点 irr85_myrule（表示のみ・SEC問い合わせ）
        continue-on-error: true
        run: timeout 900 python3 night/irr85_myrule.py --json | tail -30

      # ── 5-b4. 機構文の年次diff（2026-08-11新設）────────────────────────────────
      #   **歴史が唯一「効く」と出した変数（irr=85）の劣化を機械が見張る唯一の道具**。
      #   台帳に刻んだ原本の引用が、最新の年次報告にまだ在るかを照合する。
      #   ⚠**片側の検査**——消えたら赤信号／在っても安全ではない（CMTL は文を残したまま
      #   −17.2%/年で壊れた）。判定は下さない＝消えていたら門2再審査へ回すのが人の仕事。
      - name: 機構文の年次diff irr85_mech_diff（表示のみ・SEC問い合わせ）
        continue-on-error: true
        run: timeout 900 python3 night/irr85_mech_diff.py --json | tail -28

      # ── 5-b5. irr=85 の根拠監査（2026-08-11に回転盤へ登録）──────────────────────
      #   ⚠登録が無かったため **2026-08-05 の54社のまま6日間止まっていた**（実データは15社）。
      - name: irr=85 の根拠監査 audit_irr85（表示のみ）
        continue-on-error: true
        run: timeout 300 python3 night/audit_irr85.py | tail -12

      # ── 5-b6. irr=85 の二重読み（2026-08-12・A-1）────────────────────────────
      #   実測: 同じ111社でも読解の班が違うと irr=85 の付与率が 5.4%→17.1%（3.2倍・p=0.017）。
      #   門は irr=85 に別枠と席の優先を与えているので「いつ・誰に読まれたか」で資格が動きうる。
      #   ⚠**関門ではない**——未検証は欠陥ではなく工程の途中。出すのは作業リストだけで、
      #   終了コードは常に0（continue-on-error に頼らず器の側で保証してある）。
      - name: irr=85 の二重読み audit_irr85_dual（作業リスト・表示のみ）
        continue-on-error: true
        run: timeout 300 python3 night/audit_irr85_dual.py | tail -30

      # ── 5-c. パックより新しい年次報告が出ていないか（2026-08-07新設）─────────────
      #   audit_stale_bs は**のれんの入替**しか見ないので、買収をしない優良企業が
      #   静かに1会計年度ぶん古くなるのは今日どの検査器にも掛からなかった。
      #   実測(初回): MSFT・KLAC（ともに投下可）を含む5社が1年遅れ。
      #   **関門にはしない**——新しい10-Kが出ているのは欠陥ではなく再審査の合図で、
      #   今日これで切ると投下可が落ちる＝「落ちるなら是正が先」の順序に反する（v9.9.95で守った順序）。
      - name: パックの会計年度の遅れ audit_pack_stale（表示のみ・SEC問い合わせ）
        continue-on-error: true
        run: timeout 900 python3 night/audit_pack_stale.py --write | tail -22

      # ── 6. 単調性・崖（落とさない・変化を見るための台帳）──────────────────────
      - name: 単調性と崖の実測（表示のみ）
        continue-on-error: true
        run: timeout 900 node night/audit_monotonic.js | tail -35

      # ── 6-b. irr=70 の根拠の triage（2026-08-07新設・表示のみ）─────────────────
      #   2026-08-06の全数検算は irr==85 だけが対象で、70(209社)と50(123社)は未検査だった。
      #   ところが実測では **判定圏の70を50に落とすと投下可10社中6社が落ちる**（85→70では0社）。
      #   顔ぶれが変わるたびに読む先が変わるので、CIで毎回出す。
      - name: irr=70 の根拠 triage audit_irr70（表示のみ）
        continue-on-error: true
        run: python3 night/audit_irr70.py | tail -20

      # ── 6-c. 索引と実パックの整合（2026-08-10新設・表示のみ）────────────────────
      #   out/packs_index.json は **Ⅵ一括取込の目録**であり、v9.9.102 の**孤児レコード関門**
      #   （index.html:4349）の母集団でもある。生成者は night/make_chunks.py だけで、
      #   **どのCIからも呼ばれない**＝索引と実パックがずれても誰も言わない。
      #   実害の前例: 6146 を追加した日に索引が316件のままで、一括取込しても台帳に入らなかった。
      - name: 索引と実パックの整合（表示のみ）
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          # ⚠ packs_index.json が持つのは**ファイル名**（'MSFT_gate_pack.json'）であってティッカーではない。
          #   ティッカーの集合と突き合わせると **件数は 369/369 で一致するのに全件ズレて見える**
          #   ——この検査を書いた当日に実際に踏んだ。「基準の違う二つを割る」型の同族なので、
          #   **両側をファイル名に揃えてから**比べる。
          idx = json.load(open('out/packs_index.json', encoding='utf-8'))
          i = set(idx.get('packs') or [])
          a = set(os.path.basename(p) for p in glob.glob('out/*_gate_pack.json'))
          print(f'索引 {len(i)}件 / 実パック {len(a)}件')
          only_i, only_a = sorted(i - a), sorted(a - i)
          if only_i: print('⚠ 索引にあるが実体が無い:', only_i)
          if only_a: print('⚠ 実体はあるが索引に無い（Ⅵ一括取込で台帳へ入らない）:', only_a)
          if not (only_i or only_a): print('✓ 一致')
          EOF

      # ── 6-d. explain_score と score_all が同じことを言うか（2026-08-10新設）───────
      #   night/explain_score.js は**判定式を書き写していたせいで3版ぶん取り残された**前歴がある
      #   （v9.9.98でE[r]遮断器を外した後も要求し続け、WSTで buy が食い違った）。
      #   今は score_all の buyGate を import する正しい形だが、**写し戻しを検出する仕掛けが無い**。
      #   v9.9.65「同じ台帳を見る二つの検査器が違うことを言ってはいけない」の番人。
      # v9.9.140: **continue-on-error を外した。** 番人が落ちてもワークフローが緑なら、
      #   番人が居ないのと同じ（実測で2本とも飾りになっていた）。
      - name: explain_score と score_all の一致（v9.9.65の番人）
        run: |
          node -e "
            const {buyGate}=require('./night/score_all.js');
            if(typeof buyGate!=='function'){console.error('✗ score_all が buyGate を export していない');process.exit(1);}
            const src=require('fs').readFileSync('night/explain_score.js','utf8');
            if(!/require\(.\.\/score_all/.test(src)&&!/buyGate/.test(src)){
              console.error('✗ explain_score が buyGate を呼んでいない＝判定式を写した疑い');process.exit(1);}
            console.log('✓ explain_score は score_all の buyGate を共有している');
          "

      # ── 6-e. 表示のみの監査（2026-08-10接続・落とさない）──────────────────────
      #   4本ともネット不要・数秒で終わるのに、どのCIからも呼ばれていなかった。
      #   audit_irr70 が既にここに居る以上、同種を外している理由が無い。
      #   とくに audit_basis は「基準の混在は消せなくても**見えるようにしておく**」ための道具で、
      #   その道具自体が見えていなかった。
      - name: 堀の根拠・根拠被覆・基準の混在・dom空欄の下駄（表示のみ）
        continue-on-error: true
        run: |
          python3 night/audit_moat.py --q75 | tail -12
          python3 night/audit_evidence.py --q75 | tail -12
          python3 night/audit_basis.py | tail -10
          node night/audit_dom_blank.js | tail -12

      # ── 6-e2. 利払カバーの被覆と基準（2026-08-13新設・表示のみ・落とさない）────────
      #   歴史側は「利払カバー<3 は nde>4 より左尾をよく分ける」と出した（濃縮 11.0倍 vs 2.82倍）が、
      #   **今日の台帳へそのまま当てると門が緩くなる**——被覆 58%・日本株 0/68 で、
      #   交換すると TDG（nde 5.88・債務超過）のキルが「測れない」を理由に外れる。
      #   さらに `FinanceCosts`（IFRSの財務費用＝為替差損等を含む）を利息と読んで
      #   **純現金なのに利払カバー3未満**という内部矛盾が出ていた。
      #   ⚠ この検査は買付を止めない（利払カバーは今日のどの判定にも使われていない）。
      #      物差しを替えるかを決めるための**材料**を、止まらないように毎回出す。
      - name: 利払カバーの被覆・基準・内部矛盾（表示のみ）
        continue-on-error: true
        run: python3 night/audit_intcov.py --json | tail -30

      # ── 6-e3. 採取器の版とパックの検算状態（2026-08-13新設・取得なし・0.1秒）──────────
      #   ★これが「パックに採取器の版を刻む」の効き目。今までは
      #     「採取器を直したがパックが追いつかない」取り残しを**全社再計算(約40分)**しないと
      #     知れなかった（実害: nde が12社で「純現金」と誤り、8ヶ月見えなかった）。
      #     刻印したので**取得を一切せずに一瞬で答える**＝毎回のCIで回せる。
      #   ⚠ 落とさない——取り残しは「欠陥」ではなく「工程の途中」（irr85の二重読みと同じ扱い）。
      - name: 採取器の版とパックの検算状態（表示のみ・取得なし）
        continue-on-error: true
        run: python3 night/backfill_machine_evidence.py --stamps --json | tail -20

      # ── 6-f. 人の作業リスト自身の健康診断（2026-08-10新設・落とさない）──────────
      #   ops_status は**機械の周期作業**を測るが、**人の作業と判断の正本(todo_list.json)を
      #   測るものが無かった**。実測で未完了67件のうち解決済み3件・件数のズレ2件。
      #   **古い作業リストは無いより悪い**——「まだ残っている」と嘘をつくので本物が埋もれる。
      #   あわせて gate_exceptions.json ↔ todo_list.json を突き合わせる
      #   （片方にだけ足すと**四半期の財務監視が付かない＝警報を切ったまま乗る**）。
      # 📋今日（v9.9.140）: 「今日、何をすればいいか」を一枚に集める。**表示専用・判定には一切使わない。**
      #   ⚠この道具は out/today.json を書く前に **錨(out/score_all.json)が読めているかを検問**し、
      #     読めなければ **書かずに exit 1** で落ちる（空で上書きすると画面が
      #     「今日やることはありません」と嘘をつくため）。だから continue-on-error を付けない。
      #   ⚠**この step は他の検出器より後**に置くこと——上流が書いた JSON を読んで集計するので、
      #     先に置くと1日古い在庫を今日の答えとして出す（market.yml が validate_fail を
      #     昨日の答案で採点していたのと同じ型）。
      - name: 📋今日の集計 today（錨が読めなければ書かずに落ちる）
        run: python3 night/today.py --json | tail -30

      - name: 作業リストの健康診断 audit_todo（表示のみ）
        continue-on-error: true
        run: python3 night/audit_todo.py --json | tail -25

      # ── 6-g. 検出器の出力を再審査の待ち行列へ流す（2026-08-10新設・表示のみ）──────
      #   この門は検出器を増やしてきたが、**見つけたものを誰にも渡していなかった**——
      #   audit_pack_stale / audit_stale_bs / validate_packs / watch_new_listings /
      #   watch_events のどれも渡し先が無く、しかも make_chunks は
      #   **既にパックのある社を除外する**ので再審査は構造的にキューへ載らなかった。
      #   ここで優先度つきの待ち行列にする（優先度＝門の中での位置＋理由の重み）。
      - name: 再審査の待ち行列 enqueue_reaudit（表示のみ・判定に不使用）
        continue-on-error: true
        run: python3 night/enqueue_reaudit.py --json | head -25

      # ── 7. 根拠の被覆（既知の積み残し。落とさない）────────────────────────────
      - name: 納品検査 validate_packs（表示のみ）
        continue-on-error: true
        run: python3 night/validate_packs.py --summary | tail -10

      # ── 7-b. **実ブラウザで369件を取り込んでから**の検査（2026-08-10接続）───────
      #   night/check_mobile_fit.js は playwright で ⭳全パック一括取込を実行してから
      #   360px 幅で全9タブのはみ出しを見るが、**CIに入っていなかった**（自分で「CIには
      #   入れていない」と書いてあった）。表示事故は**データを入れて初めて出る**種類で、
      #   v9.9.114/116 は実際に「台帳が空のまま走査して素通り」で見逃している。
      #   ⚠ playwright は重いので **schedule と手動のときだけ**（push毎には回さない）。
      - name: 実ブラウザ検証（369件取込→360pxで全タブ・scheduleと手動のみ）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # v9.9.140: **`npm i -D playwright` はブラウザ本体を落とさない。**
          #   これだけだと chromium が無く、しかも `continue-on-error` + `| tail` で緑のまま素通りする
          #   （実測: 唯一のCI実行で当該stepは5秒＝369件を取り込む時間ではない）。
          #   `npx playwright install` でブラウザ本体を入れる。**入らなければここで落とす**
          #   ——「検査を回したつもりで回っていない」のがこの repo の最大の事故の型だから。
          npm i -D playwright >/dev/null 2>&1 || true
          npx playwright install --with-deps chromium >/dev/null 2>&1 || \
            npx playwright install chromium >/dev/null 2>&1 || true
          node night/check_mobile_fit.js 2>&1 | tail -25
          node night/check_gate_parity.js 2>&1 | tail -25

      # ── 8. ページの重さの予算（1.7MBまで肥大した実績があるので歯止め）──────────
      - name: ページサイズの予算
        run: |
          python3 - <<'EOF'
          import os, re, sys
          p = 'index.html'
          n = os.path.getsize(p)
          h = open(p, encoding='utf-8').read()
          b64 = sum(len(m) for m in re.findall(r'data:image/\w+;base64,([A-Za-z0-9+/=]+)', h))
          print(f'index.html {n/1024/1024:.2f}MB  うち埋め込み画像 {b64/1024/1024:.2f}MB '
                f'({b64/max(n,1)*100:.0f}%)')
          BUDGET = 2.0 * 1024 * 1024
          if n > BUDGET:
              print(f'✗ 予算 {BUDGET/1024/1024:.1f}MB 超過')
              sys.exit(1)
          print('✓ 予算内')
          EOF

      # ── 9. 検査結果のコミット（2026-08-10新設）──────────────────────────────
      #   **ここが無かったせいで、上の検査は毎回走って毎回捨てられていた。**
      #   out/stale_bs.json ／ out/validate_fail.json ／ out/pack_stale.json は
      #   第四の関門（データ健全）の入力そのもので、直近の更新は3本とも「人が手で回した日」だった。
      #
      #   **schedule と手動実行のときだけ**コミットする理由:
      #     ・push トリガでコミットすると、作業中のブランチに bot のコミットが割り込む
      #     ・PR では書き込み権限が無いことがある（fork 由来）
      #   ＝**人の作業の邪魔をせず、誰も触らない日にだけ機械が更新する**形にする。
      - name: 検査結果のコミット（scheduleと手動実行のときだけ）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "ccf-gate bot"
          git config user.email "noreply@github.com"
          # out/score_all.json も入れる（2026-08-11の是正）——上で validate_packs → score_all の
          #   順に回して**正しい score_all を作っているのに、コミットに含めず捨てていた**。
          #   結果、main に残るのは market.yml が作った（古い validate_fail を読んだ）ほうで、
          #   投下可の一覧が第四の関門と食い違っていた（実害: RBC）。作った答えは捨てない。
          # out/pending.json も入れる（2026-08-11の是正・上と同じ型の取りこぼし）——
          #   5-b2 で audit_pending を回しているのに**コミットに含めていなかった**ので、
          #   **第四の関門が読む pending.json は手で回したときしか更新されなかった**。
          #   out/irr85_myrule.json は新着の検出に前回の在庫を使うので、
          #   コミットしないと**毎回「全社が新着」になり新着の意味が消える**。
          git add out/today.json out/gate_parity.json out/kessan_flags.json out/stale_bs.json out/pack_stale.json out/validate_fail.json out/todo_audit.json out/score_all.json out/promotion_ready.json out/pending.json out/irr85_myrule.json out/irr85_mech_diff.json out/audit_irr85.json out/irr85_dual.json night/reaudit_queue.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "検査結果に変化なし"
          else
            # 件名の件数は **items**（validate_packs --json が書くキー）を数える。
            #   2026-08-11まで 'rows' を見ていたので**常に0**＝「納品検査FAIL 0件」と件名が嘘をつき、
            #   実際は280社あった。鳴らない警報は鳴りすぎる警報と同じくらい悪い。
            N=$(python3 -c "import json;print(len(json.load(open('out/validate_fail.json')).get('items',{})))" 2>/dev/null || echo "?")
            git commit -m "gate checks $(date -u +%F)｜納品検査FAIL ${N}件"
            git push
          fi
