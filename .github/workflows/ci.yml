# ─────────────────────────────────────────────────────────────────────────────
# 門の検査（push / PR）
#
# なぜ要るか（2026-08-06新設）
#   この repo は優れた検査器を**すでに持っている**（check_html / validate_packs /
#   score_all / audit_gate / audit_docs）。ところが既存のワークフロー3本は
#   すべて schedule + workflow_dispatch で、**編集した瞬間に走るものが一つも無かった**。
#   CLAUDE.md の歴史は「編集で入った欠陥を数日〜数週間後に手作業の監査で発見した」記録の連続で、
#   実際に踏んだものだけでも:
#     ・日本株審査依頼文が廃止済みの旧JP規約を配り続けていた
#     ・審査プロトコル正本の p2 ルーブリックに p3 の刻みが混入していた
#     ・堀の線を 75→70 にしたのに依頼文テンプレ3箇所に 75 が残っていた
#     ・Ωの合成式の説明が3本柱のまま（コードは v9.9.36 以降 4本柱）
#   いずれも**採点は動かないので誰も気づかない**型。CIがあれば混入した日に落ちていた。
#
# 思想
#   このCIは**読むだけ**で、採点にも台帳にも一切書き込まない（絶対のルール1）。
#   落とすのは「壊れている」ことが機械で確定できるものだけ:
#     構造検査・説明とコードの齟齬・投下可の顔ぶれの差分。
#   根拠の被覆（validate_packs のFAIL）は既知の積み残しなので**表示のみ・落とさない**
#   ——鳴りすぎる警報は鳴らないのと同じ。
# ─────────────────────────────────────────────────────────────────────────────

name: gate-ci

on:
  push:
    branches: ['**']
    paths:
      - 'index.html'
      - 'chomirai.html'
      - 'night/**'
      - 'out/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 投下可の差分を出すのに base 側の index.html が要る

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # ── 1. 構造検査（タブのdiv収支・参照IDの実在・スクリプト構文）────────────
      - name: 構造検査 check_html
        run: python3 night/check_html.py

      # ── 2. 説明文とコードの整合（この repo の再発する失敗の型）────────────────
      - name: 説明とコードの齟齬 audit_docs
        run: python3 night/audit_docs.py

      # ── 3. 門を実際に走らせる（compute() をDOMシムで実行＝再実装ではない）──────
      - name: 全パック採点 score_all
        run: node night/score_all.js

      # ── 4. 台帳の破損（要修正＝取込で化けた/列挙違反/内部矛盾/不可能値）────────
      #      第四の関門の土台。errが出たら落とす。
      - name: 全件点検 audit_gate
        run: |
          node night/audit_gate.js --all | tail -40
          node -e "
            const rows=require('./out/score_all.json');
            const e=rows.filter(r=>r.audE>0);
            if(e.length){console.error('要修正のあるパック: '+e.map(r=>r.t+'('+r.audE+')').join(' '));}
            // 既知の1件(AMBIQ: 赤字IPO社で営業利益率が不可能帯の外)だけは許容する。
            // 増えたら落とす＝「今より悪くしない」ラチェット。
            const unknown=e.filter(r=>r.t!=='AMBIQ');
            if(unknown.length){console.error('✗ 新しい要修正が入った'); process.exit(1);}
            console.log('✓ 要修正は既知の1件のみ');
          "

      # ── 5. 投下可の顔ぶれが変わったら**必ず目に見える形で**出す ────────────────
      #      黙って変わるのが一番怖い（v9.9.52「城の行が理由不明で出ない」の教訓）。
      - name: 投下可の差分
        run: |
          node -e "
            const rows=require('./out/score_all.json');
            const buy=rows.filter(r=>r.buy).map(r=>r.t);
            console.log('🟢投下可 '+buy.length+'社: '+buy.join(' '));
            const q=rows.filter(r=>(r.s||0)>=75).length;
            console.log('Ω75+ '+q+'社 / 全'+rows.length+'社');
          "

      # ── 6. 単調性・崖（落とさない・変化を見るための台帳）──────────────────────
      - name: 単調性と崖の実測（表示のみ）
        continue-on-error: true
        run: timeout 900 node night/audit_monotonic.js | tail -35

      # ── 7. 根拠の被覆（既知の積み残し。落とさない）────────────────────────────
      - name: 納品検査 validate_packs（表示のみ）
        continue-on-error: true
        run: python3 night/validate_packs.py --summary | tail -10

      # ── 8. ページの重さの予算（1.7MBまで肥大した実績があるので歯止め）──────────
      - name: ページサイズの予算
        run: |
          python3 - <<'EOF'
          import os, re, sys
          p = 'index.html'
          n = os.path.getsize(p)
          h = open(p, encoding='utf-8').read()
          b64 = sum(len(m) for m in re.findall(r'data:image/\w+;base64,([A-Za-z0-9+/=]+)', h))
          print(f'index.html {n/1024/1024:.2f}MB  うち埋め込み画像 {b64/1024/1024:.2f}MB '
                f'({b64/max(n,1)*100:.0f}%)')
          BUDGET = 2.0 * 1024 * 1024
          if n > BUDGET:
              print(f'✗ 予算 {BUDGET/1024/1024:.1f}MB 超過')
              sys.exit(1)
          print('✓ 予算内')
          EOF
