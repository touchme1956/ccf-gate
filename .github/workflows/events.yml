# 8-K イベント駆動監視（2026-08-04新設・提案4）
#
# なぜ market.yml と別ファイルか: market.yml は株価とE[r]台帳（判断の入力）、こちらは
#   8-K の警報（門2再審査への気づき）で、片方が落ちてももう片方は走るべき別系統だから。
# なぜ日次か: 8-K はイベントから原則4営業日以内に出る。四半期点検(kessan_check)の3ヶ月の
#   隙間で減損・退任・非依拠が出ても誰も見ていなかった——KLACののれん減損を見逃しかけた型。
# 鍵は不要（SECはUser-Agentのみ）。判定には使わない＝警報は門2再審査（依頼文）へ回す。
name: events watch
on:
  schedule:
    - cron: '10 22 * * 1-5'   # 平日 22:10 UTC ＝ market.yml(21:30) と時間をずらす
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # 2026-08-10: 行動が要ることを Issue で届ける（下の notify）
jobs:
  watch:
    runs-on: ubuntu-latest
    # v9.9.140: **`| tail` が失敗を緑に化かすのを止める。**
    #   宣言が無いと pipefail が付かず、`検査 | tail -25` は tail の成功だけを見る
    #   ＝「検査を回したつもりで回っていない」が緑のまま通る。
    #   実測(2026-08-11)で、今日のCIは pipefail を入れても壊れない（該当コマンドは全て exit 0）。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # ops_status が git の最終コミット日で各サイクルの回転を測るため全履歴が要る
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 監視リストのイベント走査（米国=8-K・日本株=EDINET臨報/訂正/報告書）
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}   # 未設定なら日本株は「対象外の穴」と明示される（無料鍵: api.edinet-fsa.go.jp）
        run: python3 night/watch_events.py
      - name: 運用サイクルの回転状態を実測（毎日——止まった作業を翌日には⚠にする）
        run: python3 night/ops_status.py
      # 2026-09-22新設: パックが持つ採点欄を数え直す。門の帯(ccfLedgerStale)が
      #   「台帳が古くて欄を持っていない」を自力で言うための材料。
      #   ⚠**ここで毎日回さないと、検査そのものが古い欄の一覧で黙る**——
      #     acqS5 を新設した日に LRCX が投下可から消えた事故（2026-09-22）は
      #     まさに「新しい欄を誰も数えていなかった」ことが見えなかった型。
      - name: パックが持つ採点欄を数える（台帳の取り残しを門が自力で検出するため）
        run: python3 night/pack_fields.py
      # ── 通知（2026-08-10新設）─────────────────────────────────────────────
      #   CIの全ステップは continue-on-error で、**失敗しても翌日 ops_status が⚠にするまで
      #   誰も知らない**。門の🔔タブは表示するが**開いた人にしか届かない**。
      #   20-30年回す前提で「知らせる経路が人が見に行くだけ」は弱いので、
      #   **行動が要ることだけ**を Issue にする（通知が飛び、閉じるまで消えない）。
      #   ⚠**冪等が肝**——毎日走るので、同じことで Issue が増えたらそれ自体が警報の死になる。
      #     本文に <!--ccf:キー--> を埋め、同じキーの open issue が有れば作らない。
      #     キーは「何が起きたか」で作るので**状態が変われば新しい Issue・変わらなければ増えない**。
      - name: 行動が要ることを Issue にする
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 night/notify_issues.py --json > /tmp/issues.json
          python3 - <<'PY' > /tmp/todo_issues.tsv
          import json
          d = json.load(open('/tmp/issues.json', encoding='utf-8'))
          for o in d.get('issues', []):
              body = o['body'] + "\n\n<!--ccf:" + o['k'] + "-->"
              print("\t".join([o['k'], o['title'], ",".join(o.get('labels') or []),
                                body.replace("\n", "\\n")]))
          PY
          while IFS=$'\t' read -r K T L B; do
            [ -z "$K" ] && continue
            if gh issue list --state open --search "ccf:$K" --json number --jq 'length' | grep -qv '^0$'; then
              echo "既にある: $K"; continue
            fi
            printf '%b' "$B" > /tmp/body.md
            gh issue create --title "$T" --body-file /tmp/body.md || echo "issue作成に失敗: $T"
          done < /tmp/todo_issues.tsv

      - name: コミット（警報があれば件名に出す——毎日のノイズに埋もれさせない）
        run: |
          git config user.name  "ccf-gate bot"
          git config user.email "noreply@github.com"
          N=$(python3 -c "import json;print(len(json.load(open('out/events_watch.json'))['alerts']))" 2>/dev/null || echo 0)
          D=$(python3 -c "import json;print(sum(1 for r in json.load(open('out/ops_status.json'))['items'] if r['state']=='due'))" 2>/dev/null || echo 0)
          MSG="events watch $(date -u +%Y-%m-%d)"
          [ "$N" -gt 0 ] && MSG="⚠ 8-K警報 ${N}件｜$MSG"
          [ "$D" -gt 0 ] && MSG="⚠ サイクル停止疑い ${D}本｜$MSG"
          git add out/events_watch.json out/ops_status.json
          git diff --staged --quiet || git commit -m "$MSG"
          # ⚠2026-08-18: 素の `git push` は remote が進んだだけで弾かれ、
          #   **作ったコミットがまるごと捨てられる**（market.yml が2営業日連続で70ファイル失った）。
          #   cron は10〜40分ふつうに遅れるので「時間をずらす」では防げない。rebase して再試行する。
          . night/git_push_safe.sh
          ccf_git_push
