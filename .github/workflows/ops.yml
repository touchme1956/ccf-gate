# 月次運用サイクルの自動実行（2026-08-04新設・ユーザー要望「すべて回るように」）
#
# 何を回すか: 鍵なしで機械的に回せる月次〜四半期の作業を毎月2日にまとめて回す——
#   決算カレンダー(SEC推定・鍵なし可)／監視リスト生成(保有∪投下可∪Ω75+∪要審査∪pin)／
#   X監視表の開通ライン再計算／保有・監視の決算点検(米・SEC)／配当分離(divY)。
#   7月だけ v10影スコアも更新する（年次較正の材料。答え合わせ自体はユーザーと＝自動化しない）。
# 回せないもの（ops_status.json が「手動」として見張る）: 日本株の決算点検(EDINET鍵)・
#   門0発掘(companyfacts.zip 1.4GB)・年次較正の判定・審査そのもの。
# 各ステップは continue-on-error——1本の失敗で他を止めない。失敗は隠れない:
#   ops_status.py が最終実行日を実測するので、止まった作業は門の⚙自動化タブで⚠になる。
# 前向きの検定（mw_forward・nx_forward）は**別のジョブ forward**（このファイルの末尾）で回し、結果は他の成果と
#   別のコミットで先に push する（2026-09-29・検査役の指摘: 同じコミットに乗せると、他の workflow と同じ時間帯に
#   書き換えるファイルの rebase が解けないとき、その月の確定がまるごと捨てられる）。
name: monthly ops
on:
  schedule:
    # 2026-09-29: 分を 0 から 17 へずらした——GitHub は毎時0分を高負荷の時間として遅延・取りこぼしを挙げている
    #   （実測でも events.yml は2〜4時間遅れていた）。月1回の実行が落ちると次は翌月になる。
    - cron: '17 23 2 * *'   # 毎月2日 23:17 UTC（market.yml/events.ymlと時間をずらす）
    # 予備: 3日は forward ジョブだけが動き、今月すでに取り込んだ群は回さない（ops ジョブは回らない＝下の if）。
    #   ⚠ この文字列は下の2か所（ops ジョブの if・forward ジョブの「要るか」）と一字一句同じにすること
    - cron: '17 23 3 * *'
  workflow_dispatch:
    inputs:
      forward:
        description: '前向きの検定（auto＝今月まだ取り込んでいない群だけ回す／force＝必ず回す／skip＝回さない）。月の途中に force で回すと nx の F2 の形成月が変わりうる（forward ジョブの注記）'
        type: choice
        options: [auto, force, skip]
        default: auto
permissions:
  contents: write
jobs:
  ops:
    # 予備の3日（前向きの検定の取りこぼしを拾うだけ）では、月次の作業は回さない
    if: github.event.schedule != '17 23 3 * *'
    runs-on: ubuntu-latest
    # v9.9.140: **`| tail` が失敗を緑に化かすのを止める。**
    #   宣言が無いと pipefail が付かず、`検査 | tail -25` は tail の成功だけを見る
    #   ＝「検査を回したつもりで回っていない」が緑のまま通る。
    #   実測(2026-08-11)で、今日のCIは pipefail を入れても壊れない（該当コマンドは全て exit 0）。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # ops_status が git の最終コミット日で回転を測るため全履歴が要る
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      # v9.9.134: **AV_KEY を渡していなかった**（2026-08-10 実測）。
      #   kessan_calendar.py は環境変数 AV_KEY を読む設計なのに ops.yml が渡しておらず、
      #   Secrets に置いても**何も起きない**状態だった＝「鍵を置いたのに動かない」という
      #   いちばん静かな壊れ方（副作用の無い経路は失敗しても静か・v9.9.133と同型）。
      #   鍵が無ければ従来どおり SEC 推定で回る（**壊れない側に倒れている**）。
      - name: 決算カレンダー（AV_KEYがあれば実日・無ければSEC推定）
        continue-on-error: true
        env:
          AV_KEY: ${{ secrets.AV_KEY }}
        run: |
          if [ -n "$AV_KEY" ]; then echo "AV_KEY あり → EARNINGS_CALENDAR で実日を取る";
          else echo "AV_KEY 未設定 → SEC推定で回る（穴として明示・無料鍵: alphavantage.co）"; fi
          python kessan_calendar.py
      # market_fetch は per/perF/analysts を取る（perF は判定圏の gcap の前提）。
      #   無料枠は 25req/日 なので resume 設計。鍵が無ければ何も取らずに終わる。
      - name: 市場データの採取（AV_KEYがあるときだけ・無料枠25req/日でresume）
        continue-on-error: true
        env:
          AV_KEY: ${{ secrets.AV_KEY }}
        run: |
          if [ -n "$AV_KEY" ]; then timeout 900 python market_fetch.py | tail -12;
          else echo "AV_KEY 未設定＝スキップ（perF が埋まらない穴。判定には使わないが門Xの前提）"; fi
      # 2026-09-28: 業種ごとの売上の伸び・利益率・投資を SEC frames から集計（industry.html が読む・判定に不使用）。
      #   鍵なし。SIC は out/sic_by_cik.json に貯めてあり、新しい社だけ取りに行く。
      - name: 業種の伸び（industry_trends）
        continue-on-error: true
        run: |
          timeout 2400 python3 night/industry_trends.py | tail -8
          timeout 600 python3 night/industry_long.py | tail -8
          # 2026-09-28: 比重が過去最大を付けた業種のその後（事前登録 out/industry_peak_prereg.json）と、自分のお金の業種の割合。
          #   exposure は peak の結果（市場の比重）を読むので peak の後に回す
          timeout 600 python3 night/industry_peak.py | tail -4
          timeout 600 python3 night/industry_exposure.py | tail -4
      - name: 監視リスト生成
        continue-on-error: true
        run: python3 make_kanshi.py
      - name: X監視表の開通ライン再計算
        continue-on-error: true
        run: python x_watch_recalc.py
      - name: 保有・監視の決算点検（米・四半期作業の月次先回り）
        continue-on-error: true
        run: python kessan_check.py
      - name: 決算点検（日本株・EDINET鍵があるときだけ自動）
        continue-on-error: true
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ -n "$EDINET_API_KEY" ]; then
            pip -q install pypdf
            python3 kessan_check_jp.py
          else
            echo "EDINET_API_KEY未設定＝スキップ（既知の穴。無料鍵: api.edinet-fsa.go.jp → Secretsへ）"
          fi
      - name: 配当分離(divY)——予実台帳の補正項
        continue-on-error: true
        run: python3 night/fill_divy.py
      # 自己相対バリュエーション（v9.9.118・2026-08-09新設・鍵不要）
      #   門のⅥ買付順位が「現PERはこの銘柄自身の過去の何%タイルか」を出すためのデータ。
      #   **表示専用**——遮断器としては事前登録(out/hist_valuation_prereg.json)の6基準に
      #   一つも合格しなかったので合否には使わない。out/dashboard.json と同じ作法で、
      #   **CIで計算してJSONで配る**（ブラウザから外部APIを叩かない）。
      #   監視リスト生成の**後**に置く——kanshi_list.json が入力なので、順序が逆だと
      #   前月の名簿で採ることになる（v9.9.112 で踏んだ「線が動いたら監視リストも再生成する」の同型）。
      # ⚠2026-08-10: **分母の取得器を先に置いた。** hist_valuation は市場調整版(adj_pe)で
      #   S&P500実績PERを分母に使うが、その系列を作る night/fetch_sp500_pe.py は
      #   **どのCIからも呼ばれておらず**、out/sp500_pe_monthly.json は最新 2026-03 で止まっていた。
      #   消費側だけ毎月回して分母を持ち越すのは「基準の違う二つを割る」型の芽そのもの
      #   （CLAUDE.md v9.9.118 が自ら「4ヶ月ぶん持ち越し」と記録している）。
      #   ※配信元(multpl)の遅れ自体は供給側の問題でここでは解けない——取得器を繋ぐだけ。
      - name: S&P500実績PERの系列を更新（自己相対の分母）
        continue-on-error: true
        run: timeout 300 python3 night/fetch_sp500_pe.py
      - name: 自己相対バリュエーション（表示専用・合否に不使用）
        continue-on-error: true
        run: timeout 900 python3 night/hist_valuation.py --asof "$(date -u +%F)" --tickers kanshi_list.json --out out/hist_val_now.json
      # 網(ETF)の材料（v9.9.160・2026-08-20新設・鍵不要）
      #   Ⅵ買付順位の ◈網 の節がこれを読む。網の門(ami.html)のキル（設定3年／純資産／経費率）と
      #   実効銘柄数・加重経費率・ルックスルーを出す。**判定は持たない**——ETFの選定と
      #   網/城の比率は門の外（DCA側）の決断で、Ω・四関門・売却規律には触れない。
      #   止まると **NASA が3年を越えても⛔のまま**／経費率が古いまま画面に出続ける。
      - name: 網(ETF)の材料（表示専用・合否に不使用）
        continue-on-error: true
        run: timeout 900 python3 night/net_plan.py
      # 銘柄ごとの企業説明（v9.9.125・2026-08-09新設・鍵不要）
      #   原本(10-K/20-F)の Item1 冒頭と、台帳の _meta.evidence（事業の事実）を同一オリジンで配る。
      #   **表示専用**——Ω・堀・買付の判定には一切使わない。日本株のPDF経路は穴として明示している。
      - name: 企業説明の採取（表示専用・合否に不使用）
        continue-on-error: true
        run: timeout 2400 python3 night/fetch_profiles.py
      # 事業説明の日本語要約の被覆（v9.9.154・2026-08-18新設）
      #   ⚠**必ず上の採取の直後**に置く——素材(profiles.json)が新しくなると、
      #     指紋が変わって訳が自動的に「古い」へ落ちる。その場で数えないと
      #     📋今日タブは1ヶ月ぶん古い被覆を今日の答えとして出す
      #     （market.yml が validate_fail を昨日の答案で採点していたのと同じ型）。
      #   ⚠ 訳そのものは人が書く（第三者の要約は使わない）＝ここでは数えるだけ。
      - name: 日本語要約の被覆を数える（表示専用）
        continue-on-error: true
        run: python3 night/profiles_ja.py --audit --json | tail -20
      # 門外例外（特別枠）の四半期監視（2026-08-09新設・鍵不要）
      #   例外で買った社を、門が止めている当の指標(nde)で四半期ごとに測り直す。
      #   **止まると警報を切ったまま乗ることになる**ので回転盤にも載せてある。
      - name: 門外例外の四半期監視（TDG/LOAR/MKSI）
        continue-on-error: true
        run: timeout 600 python3 night/watch_exceptions.py
      # irr=85 の実績台帳（v9.9.124・2026-08-09新設・鍵不要・ネットワーク不要）
      #   別枠85と席の優先を「本人の実現複利がハードル15%以上の社」に限るためのデータ。
      #   **止まると甘い側へ壊れる**——新しく irr=85 になった社は載らず「中立」で特権を受けるため。
      - name: irr=85の実績台帳（特権の裏づけ）
        continue-on-error: true
        run: python3 night/irr85_mech_test.py --json
      # 新規上場社の irr 機構語（2026-08-10新設・ユーザー明示指示・鍵不要）
      #   **上場後1年で最初の10-Kが出た瞬間に母集団へ入れる**ための掃除。
      #   2026-08-08のスイープは一回きりで、しかも読解リストを「パックが無い社」に絞っていたため
      #   (a)上場初年度の会社は網に掛からず (b)KRMN型（パックはあるが irr の根拠が空）が外れていた。
      #   **判定はしない**——出るのは作業リストで、irr の刻みは原本を読む審査官が決める（ルール2）。
      - name: 新規上場社の irr 機構語を掃く（作業リスト・判定はしない）
        continue-on-error: true
        run: timeout 2400 python3 night/watch_new_listings.py
      # 成長の軌道 cagrT（v9.9.123・2026-08-10にCIへ接続・鍵不要）
      #   cagrT は compute() が実際に使う採点入力で、**空欄は CCF_BLANK の 'best'＝罰が発火しない**。
      #   ＝この道具が止まると**新しく審査した社ほど甘くなる**。表示専用ではないので優先度が高い。
      #   ⚠**値は書かない**（--write を付けない）。出るのは out/growth_trend.json という測定結果で、
      #     パックへ入れるのは審査官の手（絶対のルール2）。
      - name: 成長の軌道 cagrT の再測定（測定のみ・パックには書かない）
        continue-on-error: true
        run: timeout 1800 python3 night/fill_growth_trend.py
      # シェア趨勢 sht（2026-08-10新設・鍵不要）
      #   **これが門でいちばん長く不発だった規則**——sht は全369社中322社が空欄で、門は空欄を
      #   SELECT既定の 'flat' に化かすため、pm±3/−10・地味業界の勝者+2・**Intel警報
      #   （gmt=down ∧ sht=down＝堀崩壊の先行検出）**・S2売却規律2規則が全社で不発だった。
      #   原因は規約ではなく**道具の欠落**——fill_sht が要求する out/_sic_cache.json を
      #   作る道具がリポジトリに一本も無かった（2026-08-10に build_sic_cache.py を新設）。
      #   ⚠**--write は付けない**。出るのは out/sht_report.json という測定結果で、
      #     パックへ入れるのは審査官の手（絶対のルール2）。
      - name: SIC業種キャッシュ（増分・SEC submissions）
        continue-on-error: true
        run: timeout 1800 python3 night/build_sic_cache.py
      - name: シェア趨勢 sht の再測定（測定のみ・パックには書かない）
        continue-on-error: true
        run: timeout 600 python3 night/fill_sht.py --json | tail -20
      # 銘柄アイコンと代表色（2026-08-10接続・表示専用）
      #   out/logos/index.json の note は「**night/logo_colors.py がCIで算出**」と書いていたのに
      #   **どのCIからも呼ばれていなかった**＝説明と実装の齟齬（audit_docs が本来落とす型）。
      #   実害は小さいが、**新しく審査した社は静かにモノグラムへ落ちる**（ロゴが出ない）。
      # ★2026-08-17（v9.9.152・ユーザー報告「新しく入った銘柄に色がない」）——
      #   **この2行が色を消していた**。実測: この日の実行で 色あり 318 → 104（PNGの214件が全滅）。
      #   (1) fetch_logos が index.json をディスクから作り直して測定値を捨て
      #   (2) logo_colors が **Pillow 不在**で PNG を測れず、その「測れなかった」を色なしで上書き
      #   ＝ pip install がどのworkflowにも無いので、**CIでは最初からPNGが測れていなかった**。
      #   是正: fetch_logos は指紋(b)が一致する測定値を持ち回す／logo_colors は
      #   **標準ライブラリだけでPNGを読む**（Pillow任意）＋測れなければ前回の測定を残す＋
      #   色が減る書き込みは拒否（--allow-loss が無い限り exit 1）。
      #   Pillow は「あればPILで測る」だけの高速路。**入らなくても色は出る**ので || true でよい。
      - name: 銘柄アイコンと代表色（表示専用）
        continue-on-error: true
        run: |
          pip install --quiet Pillow 2>/dev/null || echo "※Pillow無し——標準ライブラリの読み手で測る（設計どおり）"
          timeout 1200 python3 night/fetch_logos.py || true
          timeout 600 python3 night/logo_colors.py || true
          python3 - <<'PY'
          import json
          h=json.load(open('out/logos/index.json'))['have']
          n=sum(1 for v in h.values() if v.get('c'))
          print(f"::notice::ロゴ代表色 {n}/{len(h)}銘柄（色が減っていたら logo_colors が中止して前の値を残す）")
          PY
      # パック索引の再生成（2026-08-10接続）
      #   out/packs_index.json は **Ⅵ一括取込の目録**であり v9.9.102 の**孤児レコード関門**の母集団。
      #   生成者は make_chunks.py だけで、どのCIからも呼ばれていなかった。
      #   実害の前例: 6146 を追加した日に索引が316件のままで一括取込しても台帳に入らなかった。
      #   ⚠ make_chunks は夜間審査のチャンクも作るが、**未審査の社が無ければ何も増えない**
      #     （night/make_chunks.py:44 が既にパックのある社を除外する）。
      - name: パック索引の再生成（Ⅵ一括取込の目録）
        continue-on-error: true
        run: python3 night/make_chunks.py | tail -5
      # 再審査の待ち行列 → rechunk（2026-08-10新設）
      #   検出器が見つけたものを**実際に審査できる形**（10社/枚）へ落とす。
      #   新規審査の chunkNN.txt とは別系列にして「まだ見ていない社」と「もう一度見る社」を混ぜない。
      #   月20社ずつ——一度に全部出すと作業リストが死ぬ（鳴りすぎる警報は鳴らないのと同じ）。
      # 待ち行列の先頭を先に採取しておく（2026-08-10新設・鍵不要）
      #   hachimon_fetch は CLAUDE.md が「月1-2回」と書く周期作業なのに
      #   **どのCIからも呼ばれていなかった**。先に採っておくと (a)審査が速くなる
      #   (b)**採取の失敗を審査の前に見つけられる**（AMBIQでティッカー取り違えを踏んだ型）。
      #   ⚠これは機械値ドラフトを作るだけ＝**審査待ち**であって台帳ではない（絶対のルール2）。
      - name: 待ち行列の先頭を先に採取（機械値ドラフト・審査待ち）
        continue-on-error: true
        run: |
          T=$(python3 -c "
          import json,glob,os
          done={os.path.basename(f).split('_gate_pack')[0] for f in glob.glob('out/*_gate_pack.json')}
          out=[]
          for f in sorted(glob.glob('night/chunk*.txt')):
              for t in open(f).read().split():
                  if t not in done and t not in out: out.append(t)
                  if len(out)>=5: break
              if len(out)>=5: break
          print(' '.join(out))" 2>/dev/null || true)
          if [ -n "$T" ]; then timeout 1800 python hachimon_fetch.py $T | tail -8; else echo "未審査の待ち行列は空"; fi
      - name: 再審査チャンクの生成（優先度順に月20社）
        continue-on-error: true
        run: |
          python3 night/enqueue_reaudit.py --json | tail -5
          python3 night/make_chunks.py --reaudit --top 20 | tail -3
      - name: v10影スコア更新（7月のみ＝年次較正の材料）
        continue-on-error: true
        run: |
          # ★2026-08-16 訂正: **v10_series.py は存在する**（commit 48002a8・2026-08-09 に
          #   out/v10_shadow.json と同時に追加・origin/main に在る）。2026-08-12 の記録が
          #   「git 全履歴にも無い」と書いていたのは誤りで、実測で MSFT が在庫の 75.7 を
          #   因子まで完全再現した＝道具は動くし決定的。存在検査は残す（本当に消えたときの保険）。
          #
          # ⚠ ただし**この実行は out/v10_shadow.json を上書きする**。2027-07 に走れば
          #   2026年ビンテージは在庫から消えるので、答え合わせの材料は
          #   calibration.json の凍結キー（v10_scores_2026 / snapshots.2026）から採ること。
          #   ——在庫ファイルを材料に名指ししてはいけない（V10_SPEC の「注意」を参照）。
          if [ "$(date -u +%m)" != "07" ]; then echo "7月以外はスキップ";
          elif [ -f v10_series.py ]; then python3 v10_series.py;
          else echo "::warning::v10_series.py が消えている——v10影が更新できない。2027-07の答え合わせの前に要復旧"; fi
      # v11「引き算の門」の影（2026-08-12新設・V11_SPEC.md）
      #   **正本の判定には一切使わない。** v10 が「仕様書に書いてあるのに道具が無い」状態で1年放置された
      #   ので、v11 は最初から回転盤とCIに載せて**止まったことが見える**ようにする。
      - name: v11影スコア更新（影・合否に不使用）
        continue-on-error: true
        run: |
          timeout 2400 python3 night/v11_facts.py || true
          # ★2026-08-13: 利払カバーをパックへ充填（v9.9.142 で財務キルの第二の物差しになった）。
          #   **compute() は DOM しか見ない**ので、パックの欄として流さないとキルが読めない。
          #   ⚠ 使うのは intcov_strict（真正の利息だけ）——FinanceCosts を混ぜると
          #     純現金の会社が3未満に見える（実測8社）。空書き込みの検問は器の中にある。
          timeout 300 python3 night/fill_intcov.py --write || true
          node night/v11_gate.js | tail -20
      # 年次較正のスナップショット（2026-08-10にCIへ接続・鍵もネットもcompanyfactsも不要）
      #   回転盤は calib を auto=False としていたが、**人の判断が要るのは v9 vs v10 の勝敗判定**であって
      #   スナップショットの生成ではない。同じ較正ループのもう半分 v10_series.py は既に7月だけ自動で、
      #   **片方だけ手動という非対称**が残っていた。しかもこれは**時点を逃すと永久に失われる**唯一の項目
      #   （CLAUDE.md: 「calibration.json に v9 の Ω合成値が無く 2027-07 の答え合わせが成立しない」で一度失敗済み）。
      - name: 年次較正のスナップショット（7月のみ・勝敗の判定は人）
        continue-on-error: true
        run: |
          if [ "$(date -u +%m)" = "07" ]; then python3 calibration_check.py; else echo "7月以外はスキップ"; fi
      # WACCの既定値(無リスク金利)のズレ検出（2026-08-07新設・鍵不要）
      #   値は書き換えない——rfrの更新はユーザーの月次ルーチン。自動化するのは**検出**だけ。
      # E[r]の予実の**突合せ**（2026-08-10接続）
      #   market.yml は月初に `--snap`（観測の封印）だけを回しており、
      #   **引数なしの突合せ（封じた観測 vs 実現リターン）は誰も回していなかった**。
      #   回転盤の `er` は観測の封印しか測らないので、**突合せが一度も走らなくても緑**になる。
      #   E[r] は v9.9.98 で合否から外したが「正直に記録して検証される予測」として残した項目で、
      #   **検証が走らないなら残した意味が消える**。180日未満は年率換算しない規約は道具の側にある。
      - name: E[r]予実の突合せ（封じた観測と実現の答え合わせ）
        continue-on-error: true
        run: timeout 900 python3 night/audit_er_realized.py | tail -25
      # 決断の材料を毎月作る（2026-08-10新設）
      #   todo_list.json の「決断待ち」は36件あるが、**その決断の材料を作る shadow_* は
      #   一度も定期実行されていなかった**——決断が毎回「材料を作るところ」から始まる。
      #   影の計測は**必ず正本を元へ戻す**作りなので、CIで回しても採点は動かない。
      #   ⚠重いものは載せない（retro_* は歴史の再構成で数十分かかる）。
      - name: 決断の材料（影の計測・正本は必ず元へ戻る）
        continue-on-error: true
        run: |
          timeout 900 python3 night/shadow_alloc_buckets.py --json 2>&1 | tail -8 || true
          timeout 900 python3 night/shadow_irr85_proven.py 2>&1 | tail -8 || true
          timeout 900 python3 night/shadow_frame85_kills.py 2>&1 | tail -6 || true
          node night/audit_weights.js --q75 2>&1 | tail -12 || true
      # ── 城の相関（2026-08-11新設）───────────────────────────────────────────
      #   1銘柄の上限8%（¼ケリー）は厳密に守るのに、**束では一度も測っていなかった**。
      #   半導体5社が城の31.1%・航空防衛4社が31.5%＝2つで62.6% なのに、
      #   「同じ束か」の判断材料が**業種のラベルだけ**だった——ラベルは人が貼り、相関は市場が決める。
      #   **判定はしない**（上限も線も置かない）。Yahoo を叩くので毎PRではなく月次。
      - name: 機構の射程と認定の寿命（表示のみ・未着手を名指し）
        continue-on-error: true
        run: timeout 120 python3 night/irr85_scope_life.py --json 2>&1 | tail -14
      - name: 城の相関（同時に落ちるか・表示のみ）
        continue-on-error: true
        run: timeout 900 python3 night/castle_correlation.py --json 2>&1 | tail -24
      # ── 採取器の是正がパックに届いているかの実測（2026-08-13新設）────────────────
      #   ★実害: nde が12社で「純現金」と誤っていた（ENB は実際には有利子負債 104,410百万CAD）。
      #     原因は**採取器が直ってもパックが追いつかない**こと——281社(76%)が 2026-07 の審査で、
      #     その後の採取器の是正3回（無形の合成・有利子負債の二重計上・規制公益の売上タグ）を
      #     受け取っていない。そして**どのパックがどの版で作られたかを記録する欄が一つも無い**ので、
      #     再計算する以外に知る方法がない。これを毎月やる。
      #   ⚠ **--sync は絶対に自動で走らせない**——実測で食い違い382件のうち
      #     2件は単位のずれ(PKE fcf 11.0→0.0095)・39件は3倍超(年ずれ/IC縮退の疑い)で、
      #     一括反映すると**桁の誤りと年の誤りを注入する**（影の計測でΩが最大66.7pt動いた）。
      #     この器は**読むだけ**。直すのは人が原因を確かめてから。
      - name: 採取器とパックの食い違い（読むだけ・--sync は走らせない）
        continue-on-error: true
        run: |
          timeout 3000 python3 night/backfill_machine_evidence.py --write --json 2>&1 | tail -12
          python3 night/backfill_machine_evidence.py --stamps --json 2>&1 | tail -8

      - name: WACC既定のズレ検出 audit_wacc_stale
        continue-on-error: true
        run: timeout 300 python3 night/audit_wacc_stale.py --write
      # 前向きの検定（mw_forward・nx_forward）はこのジョブでは回さない——末尾の forward ジョブを見よ。
      #   ⚠ このジョブの ops_status は forward ジョブと並んで走るので、その日の前向きの結果より先に盤を書くことがある
      #     （翌営業日の events.yml の ops_status が直す。期限は40日なので状態は変わらない）。
      # ⚠2026-08-10: **ops_status を最後へ移した。** 以前は wacc の**前**に居たので、
      #   コミットされる out/ops_status.json は必ず1ヶ月前の wacc 日付を載せていた
      #   ——盤が自分より後の作業を測れない、という順序の誤り。
      - name: 運用サイクルの回転状態を実測（必ず最後）
        run: python3 night/ops_status.py

      - name: コミット
        run: |
          git config user.name  "ccf-gate bot"
          git config user.email "noreply@github.com"
          N=$(python3 -c "import json;print(sum(1 for r in json.load(open('out/ops_status.json'))['items'] if r['state']=='due'))" 2>/dev/null || echo "?")
          MSG="monthly ops $(date -u +%Y-%m-%d)"
          [ "$N" != "0" ] && MSG="⚠ 停止疑い ${N}本｜monthly ops $(date -u +%Y-%m-%d)"
          # ⚠2026-08-10: **out/wacc_drift.json が漏れていた**——上の audit_wacc_stale が --write で
          #   生成しているのに add されず、毎回作っては捨てていた（回転盤の waccdrift は auto=True なのに
          #   実体が残らないので、鮮度も測れなかった）。
          #   あわせて sp500_pe_monthly（自己相対の分母）・growth_trend（cagrTの測定結果）・
          #   calibration（7月のスナップショット）も add する。**足したら add も足す**——
          #   ステップだけ増やして add を忘れると「回っているのに残らない」という同じ穴が再発する。
          # ⚠2026-08-13: **パックを add していなかった。** ops.yml には既にパックへ書く器が3本ある
          #   （audit_wacc_stale --write / backfill_machine_evidence --write / fill_intcov --write）のに
          #   `out/*_gate_pack.json` が add の一覧に無く、**毎月作っては捨てていた**。
          #   これは今日4回直した「作った答えを捨てる」型（score_all / pending / validate_fail / 今回）。
          #   とくに fill_intcov は **v9.9.142 の財務キルの入力**なので、残らないと
          #   新しいパックの利払カバーが永久に空欄＝キルが眠り続ける。
          # ⚠2026-08-17: **一つの実在しないパスが add 全体を落としていた（同じ型の6回目・最悪の形）。**
          #   `git add a b c` は1つでもパスが実在しないと**全体が失敗して1つもステージしない**。
          #   末尾の `2>/dev/null || true` がエラーも終了コードも消すので、完全に無音で起きる。
          #   下の38パスの一覧に **`out/market_data.json`（実在しない。本物は repo 直下）** が
          #   混じっており、**38パス全部が捨てられていた**（GitHub上での初回実行 run_number 1 で実測）。
          #   このとき AV_KEY は正しく効いていて、ログには `Alpha Vantage: 10/39 銘柄の決算日を取得`
          #   `ASML 2026-10-14` と出ていた——**鍵は効いていたのに成果だけが捨てられていた。**
          #   悪いパスを消すだけでは今日の1件しか直らない（次にステップを足せばまた起きる）ので、
          #   **1パスずつ add して落ちたものを名指しする** `ccf_git_add` を通す＝巻き添えが構造的に起きない。
          . night/git_add_safe.sh
          ccf_git_add 'out/*_gate_pack.json'
          # ⚠2026-08-17: **採取の出力を add していなかった（同じ型の5回目）。**
          #   2026-08-10 に「待ち行列の先頭を先に採取」ステップを足したとき、その出力
          #   `out/{T}_gate_input.json` / `_hits.txt` を add の一覧に入れ忘れていた——
          #   **すぐ上のコメントが「ステップだけ増やして add を忘れると『回っているのに残らない』」と
          #   警告している当のことを、同じ日に足したステップでやっていた。**
          #   実害: 月1で採った機械値ドラフトが毎回 捨てられ、翌月また同じ社を採り直す
          #   （SECへの無駄な往復＋審査は永久に「採取ずみ在庫ゼロ」から始まる）。
          #   out/fetch_run.json は**盤の錨**（月1・期限40日）なので、これが残らないと
          #   採取が止まったことを検出する機構ごと止まる。
          ccf_git_add 'out/*_gate_input.json' 'out/*_hits.txt' out/fetch_run.json
          #   ⚠ `out/market_data.json` は**存在しない**（market_fetch.py は repo 直下の
          #     `market_data.json` に書く）。これが38パス全部を巻き添えにしていた元凶なので外した。
          ccf_git_add out/next_earnings.json kessan_calendar.ics kanshi_list.json gate1_x_watch.json out/kessan out/divy.json out/v10_shadow.json out/v11_shadow.json out/v11_facts.json out/v11_backtest.json out/ops_status.json out/hist_val_now.json out/irr85_history.json out/irr85_mech_test.json out/profiles.json out/exception_watch.json out/castle_correlation.json out/irr85_scope_life.json out/new_listings_irr.json out/wacc_drift.json out/net_plan.json out/backfill_diff.json out/backfill_stamps.json out/sp500_pe_monthly.json out/growth_trend.json out/calibration.json out/sht_report.json out/_sic_cache.json out/packs_index.json out/logos 'night/chunk*.txt' 'night/rechunk*.txt' night/reaudit_queue.json night/progress.json out/er_ledger.json market_data.json 'out/shadow_*.json' out/gate0_run.json out/industry_trends.json out/industry_long.json out/sic_by_cik.json out/industry_peak.json out/industry_exposure.json
          # ⚠ 前向きの検定の出力（out/mw_forward.json・out/nx_forward.json・out/forward_run.json）はここで add しない
          #   ——forward ジョブが別のコミットで先に push する（同じコミットに乗せると rebase の衝突で道連れに捨てられる）。
          git diff --staged --quiet || git commit -m "$MSG"
          # ⚠2026-08-18: 素の `git push` は remote が進んだだけで弾かれ、
          #   **作ったコミットがまるごと捨てられる**（market.yml が2営業日連続で70ファイル失った）。
          #   cron は10〜40分ふつうに遅れるので「時間をずらす」では防げない。rebase して再試行する。
          . night/git_push_safe.sh
          ccf_git_push

  # ── 前向きの検定（2026-09-29接続・同日 検査役の指摘で別ジョブ・別コミットにした）────────────────────────
  #   読むだけ・判定・採点・配分には不使用。事前登録 out/mw_forward_prereg.json（eknzbh 19e8ce23）・
  #   out/nx_forward_prereg.json（b8579d18）どおりに、終わった月だけを順に取り込んで e過程を更新する。
  #   一度取り込んだ月は固定＝同じ月に2回走っても、取り込み済みの月の答えは同じ。
  #   ⚠ **別ジョブ・別コミットにした理由**: ops ジョブのコミットは、market.yml も add するパック・market_data.json・
  #     er_ledger.json と、events.yml も add する ops_status.json を含む。遅れた cron が同じ時間帯に重なると
  #     ccf_git_push の rebase が解けずに abort し、**その月の確定がまるごと捨てられる**。nx は観測した日で F2 の
  #     形成月と F3 の母集団の日付が決まるので、翌月に取り直しても同じ答えにならない。このジョブは前向きの3ファイル
  #     しか書かない（誰とも衝突しない）＝rebase が必ず解ける。
  #   ⚠ 道具とその依存は凍結してある——night/check_forward_frozen.py が out/forward_frozen.json と突き合わせ、
  #     合わなければ**更新しない**（段は失敗＝赤になる）。変わった道具で回すと、事前登録の規則が黙って変わるため。
  #   ⚠ 段は continue-on-error にしない——落ちた・時間切れは workflow の失敗として ci_health（📋今日）に出る。
  #     段ごとに out/forward_run.json へ印を書き（night/forward_run_mark.py）、盤の見張り (d) も読む。
  #   ⚠ nx の10月は国内株式の投信 約770本の基準価額を取る（sandbox の実測 1本 約2.2秒＝約28分。**runner（米国）では未計測**・
  #     失敗1回ごとに 2/4/8/16秒待ち、1回の要求は最大120秒）→ timeout 5400（90分・段 95分・ジョブ 125分）。
  #     道具の CI_LINE（timeout 1800）は過小だが、道具は凍結なので直さずここで長くする。時間切れに当たると
  #     8本すべてがその月は進まない（道具は最後にまとめて書く）。CSV の写しは同じ月の中だけ actions/cache で持ち回す
  #     ＝同じ月の手動の再実行は、12時間以内なら取り終えた分を取り直さない（道具は12時間より古い写しを取り直す）。
  #   ⚠ 値の出ない月は3か月待つと『欠測』として固定され戻せない。待ちが2か月に達したら ops_status が⚠にする。
  #   ⚠ CI では投信の CSV の写しが月をまたいで残らない（償還した投信の最後の部分の月を取り逃しうる）。
  #     重い仕組みを足さずに受け入れた——理由と影響は out/forward_frozen.json の deviations_in_ci。
  #   ⚠ 書き手は CI だけ。セッションで回した出力はコミットしない（固定した月が割れる）。night/run_ops.py は
  #     このジョブを回さない（env の CCF_CI_ONLY）。
  #   ⚠ 手で回し直すとき（Actions → monthly ops → Run workflow・forward=auto）:
  #     ・今月の定期実行（2日・予備の3日）が落ちた／時間切れで、新しいブランドの一覧が**前の月までに**出ていたなら、
  #       **その月の25日までに**回す（26日以降だと nx の F2 の形成が『公開の翌月末』より1か月遅れる）。
  #     ・**今月の2日より後に**新しい一覧が出たなら、26日以降に回すか次の2日を待つ（25日までに回すと1か月早まる）。
  #     ＝nx の F2 は一覧を初めて観測した日の月末で組む（26日以降なら翌月末）。mw は回す日で答えが変わらない。
  forward:
    # 本番（2日）・予備（3日）・手動のどれでも動く。予備と手動の auto は「今月まだ取り込んでいない群」だけを回す
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      CCF_CI_ONLY: "前向きの検定の書き手は CI だけ（night/run_ops.py はこのジョブを回さない）"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # mw の城の名簿は git の履歴から引く（roster_at）
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 今月の前向きの更新が要るか
        id: need
        env:
          EV: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          MODE: ${{ github.event.inputs.forward }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          ym = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m')
          ev, sched, mode = os.environ.get('EV', ''), os.environ.get('SCHED', ''), (os.environ.get('MODE') or 'auto')
          # 本番の2日は必ず回す。予備の3日（と手動の auto）は、今月すでに取り込んだ群を回さない
          if ev == 'schedule':
              mode = 'force' if sched == '17 23 2 * *' else 'auto'
          out = {}
          for g, p in (('mw', 'out/mw_forward.json'), ('nx', 'out/nx_forward.json')):
              try:
                  gen = str(json.load(open(p, encoding='utf-8')).get('generated') or '')
              except Exception:
                  gen = ''
              need = mode == 'force' or (mode == 'auto' and gen[:7] != ym)
              out[g] = '1' if need else '0'
              print(f"{g}: generated={gen or '?'} mode={mode} → {'回す' if need else '回さない（今月は取り込み済み・または skip）'}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"mw={out['mw']}\nnx={out['nx']}\nany={'1' if '1' in out.values() else '0'}\nym={ym.replace('-', '')}\n")
          PY
      - name: 投信の CSV の写しを戻す（同じ月の再実行だけ・判定に不使用）
        if: steps.need.outputs.nx == '1'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: out/_nx_cache/nx_forward
          key: nxfwd-${{ steps.need.outputs.ym }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nxfwd-${{ steps.need.outputs.ym }}-
      - name: 前向きの検定（mw_forward・判定に不使用）
        if: steps.need.outputs.mw == '1'
        timeout-minutes: 20
        run: |
          python3 night/forward_run_mark.py mw started
          if ! python3 night/check_forward_frozen.py --group mw; then
            python3 night/forward_run_mark.py mw frozen 1
            exit 1
          fi
          rc=0
          timeout 900 python3 night/mw_forward.py update > /tmp/mw_forward.log 2>&1 || rc=$?
          if [ "$rc" = "0" ]; then tail -12 /tmp/mw_forward.log; else tail -40 /tmp/mw_forward.log; fi
          python3 night/forward_run_mark.py mw auto "$rc" "$SECONDS"
          exit "$rc"
      - name: 前向きの検定（nx_forward・判定に不使用）
        if: ${{ !cancelled() && steps.need.outputs.nx == '1' }}
        timeout-minutes: 95
        run: |
          python3 night/forward_run_mark.py nx started
          if ! python3 night/check_forward_frozen.py --group nx; then
            python3 night/forward_run_mark.py nx frozen 1
            exit 1
          fi
          rc=0
          timeout 5400 python3 night/nx_forward.py --update > /tmp/nx_forward.log 2>&1 || rc=$?
          if [ "$rc" = "0" ]; then tail -14 /tmp/nx_forward.log; else tail -40 /tmp/nx_forward.log; fi
          python3 night/forward_run_mark.py nx auto "$rc" "$SECONDS"
          exit "$rc"
      - name: 投信の CSV の写しを残す（同じ月の再実行が続きから回る）
        if: ${{ !cancelled() && steps.need.outputs.nx == '1' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: out/_nx_cache/nx_forward
          key: nxfwd-${{ steps.need.outputs.ym }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 前向きの結果を先にコミット（他の成果と同じコミットに乗せない）
        # 取り消し（cancel）のときは push しない。段の時間切れ・失敗のときは、取れた群の結果と印を残す
        if: ${{ !cancelled() && steps.need.outputs.any == '1' }}
        run: |
          git config user.name  "ccf-gate bot"
          git config user.email "noreply@github.com"
          # 2本とも道具が最後に json.dump で直接書く（原子的でない）。時間切れの SIGTERM が書き込みの途中に当たると
          #   壊れた JSON が残り、それをコミットすると以後の実行が毎回 json.load で落ちる（前向きの月が一つも入らない）。
          #   → JSON として読めなければ add しない（その月は次の実行が取り直す・3か月以内なら失わない）。
          #   ⚠ 追跡中のファイルは**消さない**（旧版は checkout に失敗すると rm していた＝削除がステージされうる。
          #     main から消えると nx_forward.py --update は以後毎月「先に --init を回す」で止まる）。index の版へ戻すだけ
          #     （push の rebase の前に作業ツリーをきれいにするため）。戻せなければ add しないだけ。
          for g in mw nx; do
            f="out/${g}_forward.json"
            [ -f "$f" ] || continue
            if python3 -c "import json,sys;json.load(open(sys.argv[1],encoding='utf-8'))" "$f" 2>/dev/null; then
              git add -- "$f"
              continue
            fi
            echo "::warning::$f が JSON として読めない（書き込みの途中で切れた疑い）→ コミットしない"
            python3 night/forward_run_mark.py "$g" broken_output
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              git checkout -- "$f" || echo "::warning::$f を index の版へ戻せない → add しない"
            fi
          done
          git add -- out/forward_run.json
          if git diff --staged --quiet; then echo "前向きの結果に変化なし"; exit 0; fi
          git commit -m "forward tests $(date -u +%Y-%m-%d)｜mw=${{ steps.need.outputs.mw }} nx=${{ steps.need.outputs.nx }}（判定に不使用）"
          . night/git_push_safe.sh
          ccf_git_push
