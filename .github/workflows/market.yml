# 市場データの自動更新（2026-07-30新設）
#
# なぜ Firebase ではなく GitHub Actions か:
#   ブラウザから株価APIを直接叩くと**APIキーが公開ページに露出する**。それを避けるために
#   バックエンドを置く発想になりがちだが、Firebase の無料枠(Spark)は Cloud Functions からの
#   **Google以外への外部HTTP通信を許さない**ので、Finnhub を呼ぶには従量課金プランが要る。
#   一方このリポジトリは既に GitHub Pages で配信されている——**鍵を Secrets に置き、CIが
#   market_data.json をコミットし、門は同一オリジンの静的JSONを読むだけ**でよい。
#   新しいサービスも費用も認証もCORSも不要。鍵はブラウザに一度も出ない。
#
# 設定: リポジトリの Settings → Secrets and variables → Actions で FINNHUB_KEY を登録する
#   （無料鍵は https://finnhub.io/register。Alpha Vantage の1日25回と違い分あたり制限なので全社回せる）
name: market data
on:
  schedule:
    - cron: '30 21 * * 1-5'   # 平日 21:30 UTC ＝ 米国市場クローズ後
  workflow_dispatch:          # 手動実行も可
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 株価・為替・ニュースを取得
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 night/fetch_dashboard.py
      # 鍵なしの市場データ採取（2026-08-10接続）
      #   market_data.json は px だけが毎日書き戻され、**per/shy/mcap/evebit/beta は
      #   market_fetch.py 以外に書き手がおらず凍結**していた（実測 104銘柄中 per 29 / shy 26）。
      #   market_fetch.py は Alpha Vantage の鍵（1日25回）が要るが、
      #   **market_fetch_free.py は Yahoo chart + SEC companyfacts で鍵も上限も要らない**のに
      #   どのCIからも呼ばれていなかった。門Xの入力を欠測のまま放置する理由が無い。
      #   ⚠パックへ入れるのは次の market_merge.py だけ——**BANDS の常識帯検問と
      #     _meta.nulls 保護と「null以外は上書きしない」を必ず通す**（第二のマージ経路を作らない）。
      - name: 市場データ採取（鍵なし・Yahoo+SEC）
        continue-on-error: true
        run: timeout 1800 python3 market_fetch_free.py || true
      - name: 空欄のみ機械充填（常識帯の検問つき）
        run: python3 market_merge.py || true
      - name: 実測価格をパックへ反映（基準保存式・投下可の出入りを検出）
        run: python3 night/apply_prices.py --write
      # E[r]の予実台帳（2026-08-03新設）。**月初の営業日だけ**観測を封じる。
      #   毎日だと20年で5000件に膨らむが、年率リターンの検証に日次の分解能は要らない。
      #   月1回なら20年で240件——これで「E[r]が何%と言った銘柄が実際どうだったか」が測れる。
      #   **記録は残さなければ存在しない**。手作業に頼ると20年は続かないのでCIに入れる。
      #   A9(2026-08-04): この ≤7日 の窓は**毎月1〜7日の平日すべて（月5回）**に発火する——
      #   月初の休日ずれを吸収するための窓として残すが、重複防止は snap() 側が担う:
      #   snap() は**月次idempotent**（同月に観測済みならスキップ・--force でのみ同日置換）なので、
      #   窓が何回発火しても観測は月1件しか積まれない（8/3・8/4の二重封印の再発防止）。
      - name: E[r]の予実台帳へ観測を封じる（月初のみ・snap側で月次idempotent）
        run: |
          if [ "$(date -u +%d)" -le 07 ]; then
            python3 night/audit_er_realized.py --snap
          else
            echo "月初以外なのでスキップ（台帳は月1回で足りる）"
          fi
      - name: コミット
        run: |
          git config user.name  "ccf-gate bot"
          git config user.email "noreply@github.com"
          MSG="market data $(date -u +%Y-%m-%d)"
          # apply_prices が「何社動いたか」と「投下可が入れ替わったか」を書き出す。
          #   **投下可の出入りはコミット件名に出す**——毎日のノイズに埋もれさせないため。
          [ -s out/_price_commit_msg.txt ] && MSG="$(cat out/_price_commit_msg.txt)"
          rm -f out/_price_commit_msg.txt
          git add -A market_data.json out/dashboard.json out/*_gate_pack.json out/score_all.json out/er_ledger.json || true
          git diff --staged --quiet || git commit -m "$MSG"
          git push
